# Aither Portal — nginx reverse proxy (актуально на 10.07.2026)
# Схема: внешний трафик → VPS1 :10443 (этот nginx) → VPS2 :80 (портал)
#                                         → VPS1 :30900 (Gateway API /v1/)
#                                         → VPS1 :30300 (Grafana /grafana/)
# VPS2 :80 → Docker nginx → BFF :3000
#
# SSL-сертификаты:
#   fb1.spb.ru — Let's Encrypt (реальные)
#   aither.170.168.91.95.nip.io — самоподписанные (для тестов)

upstream portal_backend {
    # VPS2 — основной портал (BFF + статика)
    server VPS2_IP:80 max_fails=3 fail_timeout=30s;
    # VPS3 — резерв (опционально)
    # server VPS3_IP:80 max_fails=1 fail_timeout=10s backup;
}

server {
    listen 10443 ssl http2;
    server_name your-domain.ru;

    ssl_certificate     /etc/letsencrypt/live/your-domain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # CORS для SPA
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    if ($request_method = OPTIONS) { return 204; }

    # Health-check
    location /health {
        proxy_pass http://portal_backend/api/v1/status;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
    }

    # API и BFF (SSE-стриминг для чатов)
    location /api/ {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # OAuth-редиректы
    location /auth/ {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Gateway REST API (биллинг, usage, модели)
    location /v1/ {
        proxy_pass http://127.0.0.1:30900/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://127.0.0.1:30300/grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # SPA fallback — всё остальное на портал
    location / {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name your-domain.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host:10443$request_uri;
    }
}
