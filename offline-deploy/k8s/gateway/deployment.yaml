# Gateway — Python-прокси с биллингом, Rate Limiter, JWT-делегированием
# Актуально на 10.07.2026 — версия из K8s (namespace: default)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-code
  namespace: default
data:
  gateway.py: |
    # Код загружается из /root/aither-project/gateway/gateway.py
    # (325 строк — базовая версия без проверок тарифов)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-catalog
  namespace: default
data:
  catalog.yaml: |
    models:
      - name: qwen2.5-14b
        display_name: "Qwen 2.5 14B"
        backend: "http://vllm:8000"
        model_path: "/models/Qwen2.5-14B-Instruct"
        max_tokens: 4096
        description: "Быстрая универсальная модель"
        tokens_per_ruble: 100
        tags: [chat, code, fast]
        status: active
      - name: qwen2.5-32b
        display_name: "Qwen 2.5 32B"
        backend: "http://vllm-qwen32b:8000"
        model_path: "/models/Qwen2.5-32B-Instruct-GPTQ"
        max_tokens: 8192
        description: "Мощная модель для сложных задач"
        tokens_per_ruble: 30
        tags: [code, analysis, large-context]
        status: active
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: delegation-public-key
  namespace: default
data:
  public.pem: |
    -----BEGIN PUBLIC KEY-----
    <вставить публичный ключ из delegation/public.pem>
    -----END PUBLIC KEY-----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: default
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install -q redis pyjwt psycopg2-binary pyyaml && python3 /app/gateway.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: VLLM_URL
              value: "http://vllm:8000"
            - name: VLLM_32B_URL
              value: "http://vllm-qwen32b:8000"
            - name: REDIS_URL
              value: "redis"
            - name: RATE_LIMIT
              value: "60"
            - name: PORT
              value: "8080"
            - name: TOKEN_COST
              value: "1"
            - name: PG_URL
              valueFrom:
                secretKeyRef:
                  name: pg-url
                  key: url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app/gateway.py
              subPath: gateway.py
            - name: catalog
              mountPath: /app/catalog.yaml
              subPath: catalog.yaml
            - name: delegation-key
              mountPath: /app/delegation
      volumes:
        - name: code
          configMap:
            name: gateway-code
        - name: catalog
          configMap:
            name: gateway-catalog
        - name: delegation-key
          configMap:
            name: delegation-public-key
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: default
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30900
  type: NodePort
