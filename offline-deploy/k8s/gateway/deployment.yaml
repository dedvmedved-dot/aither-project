# Gateway — Docker-образ с биллингом, Rate Limiter, AI Security, мультимодельностью, RAG
#
# Версия: 1.2.0 (синхронизировано с живым деплойментом 2026-07-10)
# Образ: ghcr.io/dedvmedved-dot/aither-project-gateway:latest
# Dockerfile: gateway/Dockerfile (python:3.12-slim)
# Код: 13 модулей (gateway.py, auth.py, admin.py, billing.py, routing.py,
#       dlp.py, hybrid_rag.py, delegation.py, usage-collector.py,
#       reservation-reaper.py, catalog.py, metrics.py, wiki_graph.py)
#
# RAG: Gateway → chroma-proxy :9000 (эмбеддинги внутри) → ChromaDB :8000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-catalog
  namespace: default
data:
  catalog.yaml: |
    models:
      - name: qwen2.5-14b
        display_name: "Qwen 2.5 14B"
        backend: "http://vllm:8000"
        model_path: "/models/Qwen2.5-14B-Instruct"
        max_tokens: 4096
        description: "Быстрая универсальная модель — чаты, summarization, код"
        tokens_per_ruble: 100
        tags: [chat, code, fast]
        status: active
      - name: qwen2.5-32b
        display_name: "Qwen 2.5 32B"
        backend: "http://vllm-qwen32b:8000"
        model_path: "qwen2.5-32b"
        max_tokens: 8192
        description: "Мощная модель — сложный код, аналитика, длинные тексты"
        tokens_per_ruble: 30
        tags: [code, analysis, large-context]
        status: active

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: ghcr.io/dedvmedved-dot/aither-project-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: VLLM_URL
          value: http://vllm:8000
        - name: VLLM_32B_URL
          value: http://vllm-qwen32b:8000
        - name: CATALOG_PATH
          value: /app/catalog.yaml
        - name: REDIS_URL
          value: redis
        - name: RATE_LIMIT_RPM
          value: "300"
        - name: RATE_LIMIT_TPM
          value: "100000"
        - name: PORT
          value: "8080"
        - name: TOKEN_COST
          value: "1"
        - name: CHROMA_URL
          value: http://chromadb:8000
        - name: CHROMA_PROXY_URL
          value: http://chroma-proxy.default.svc.cluster.local:9000
        - name: WIKI_ROOT
          value: /app/wiki
        - name: PG_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: pg-url
        - name: ADMIN_KEY
          value: admin-388b0ed63777c064f0afd5da38904ccc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 1
        volumeMounts:
        - name: catalog
          mountPath: /app/catalog.yaml
          subPath: catalog.yaml
        - name: wiki
          mountPath: /app/wiki
        - name: delegation-key
          mountPath: /app/delegation
      volumes:
      - name: catalog
        configMap:
          name: gateway-catalog
      - name: wiki
        configMap:
          name: gateway-wiki
      - name: delegation-key
        configMap:
          name: delegation-public-key

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: default
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30900
