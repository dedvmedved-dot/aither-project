# Gateway — Python-прокси с биллингом, Rate Limiter, AI Security
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: aither
data:
  catalog.yaml: |
    models:
      - name: qwen2.5-14b
        display_name: "Qwen 2.5 14B"
        backend: "http://vllm-qwen:8000"
        model_path: "/models/Qwen2.5-14B-Instruct"
        max_tokens: 4096
        tokens_per_ruble: 100
        tags: [chat, code, fast]
        status: active
      - name: qwen2.5-32b
        display_name: "Qwen 2.5 32B"
        backend: "http://vllm-qwen32b:8000"
        model_path: "/models/Qwen2.5-32B-Instruct-GPTQ"
        max_tokens: 8192
        tokens_per_ruble: 30
        tags: [code, analysis, large-context]
        status: active
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aither
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: python:3.11-slim
        command: ["python3", "/app/gateway.py"]
        ports:
        - containerPort: 8080
        env:
        - name: PG_HOST
          value: postgres.aither
        - name: PG_USER
          value: aither
        - name: PG_PASSWORD
          value: aither_pass
        - name: PG_DB
          value: aither
        - name: REDIS_HOST
          value: redis.aither
        - name: CATALOG_PATH
          value: /etc/gateway/catalog.yaml
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: gateway-secret
              key: jwt-public.pem
        - name: JWT_SECRET
          value: "aither-jwt-secret-key-2026-production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        volumeMounts:
        - name: app
          mountPath: /app
        - name: catalog
          mountPath: /etc/gateway
      volumes:
      - name: app
        configMap:
          name: gateway-code
      - name: catalog
        configMap:
          name: gateway-config
          items:
          - key: catalog.yaml
            path: catalog.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aither
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  namespace: aither
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30900
