# vLLM 32B — Qwen 2.5 32B Instruct GPTQ (4-bit)
# Версия: 1.1.0 (синхронизировано с живым деплойментом 2026-07-07)
# Узел: n7 (worker), bootsman-k8s-clnt01-n7-gpu
# GPU: 2× RTX 6000, TP=2
# Квантизация: GPTQ 4-bit (~20 GB на диске, ~40 GB в VRAM)
# Производительность: ~35 tok/s

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen32b
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vllm-qwen32b
  strategy:
    type: Recreate  # Recreate: гарантирует освобождение GPU перед запуском нового пода
  template:
    metadata:
      labels:
        app: vllm-qwen32b
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: bootsman-k8s-clnt01-n7-gpu
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        imagePullPolicy: Always
        command: ["sh", "-c"]
        args:
          - export VLLM_PORT=8000; exec python3 -m vllm.entrypoints.openai.api_server
            --model /models --served-model-name qwen2.5-32b --host 0.0.0.0 --port 8000
            --max-model-len 8192 --gpu-memory-utilization 0.90 --dtype auto --tensor-parallel-size 2
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          value: ""  # Заполнить при развёртывании
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models-32b-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen32b
  namespace: default
spec:
  selector:
    app: vllm-qwen32b
  ports:
  - port: 8000
    targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen32b-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: vllm-qwen32b
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 32294
