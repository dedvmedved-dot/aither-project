# Prometheus — сбор метрик
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aither
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'gateway'
        static_configs:
          - targets: ['gateway.aither:8080']
      - job_name: 'vllm-14b'
        static_configs:
          - targets: ['vllm-qwen.aither:8000']
      - job_name: 'vllm-32b'
        static_configs:
          - targets: ['vllm-qwen32b.aither:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aither
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aither
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30909
