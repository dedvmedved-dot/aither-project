# ChromaDB — векторная БД для RAG
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: aither
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
      - name: chromadb
        image: chromadb/chroma:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: aither
spec:
  selector:
    app: chromadb
  ports:
  - port: 8000
    targetPort: 8000
