# vLLM 14B — Qwen 2.5 14B Instruct с LoRA-адаптером astra-14b
# Версия: 1.1.0 (синхронизировано с живым деплойментом 2026-07-07)
# Узел: n8 (control-plane), bootsman-k8s-clnt01-n8-gpu
# GPU: 2× RTX 6000, TP=2
# LoRA: astra-14b, rank=8, 65 MB (доменные знания Astra Linux, K8s, YADRO, ГОСТ)
# Примечание: --enforce-eager УДАЛЁН (медленный, 11 tok/s → 28 tok/s)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vllm-qwen
  strategy:
    type: Recreate  # Recreate: гарантирует освобождение GPU перед запуском нового пода
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: bootsman-k8s-clnt01-n8-gpu
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - --model
          - /models/Qwen2.5-14B-Instruct
          - --dtype
          - half
          - --max-model-len
          - "4096"
          - --gpu-memory-utilization
          - "0.90"
          - --tensor-parallel-size
          - "2"
          - --enable-lora
          - --lora-modules
          - astra-14b=/models/lora-qwen14b-astra/
          - --max-lora-rank
          - "8"
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: VLLM_PORT
          value: "8000"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "0,1"
        - name: VLLM_USE_V1
          value: "0"
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "2"
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        hostPath:
          path: /data/models
          type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: default
spec:
  selector:
    app: vllm-qwen
  ports:
  - port: 8000
    targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 32293
