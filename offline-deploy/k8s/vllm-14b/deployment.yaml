# vLLM 14B — Qwen 2.5 14B Instruct
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: aither
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model"
          - "/models/Qwen2.5-14B-Instruct"
          - "--dtype"
          - "half"
          - "--max-model-len"
          - "4096"
          - "--gpu-memory-utilization"
          - "0.90"
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "32Gi"
          requests:
            nvidia.com/gpu: "1"
            memory: "16Gi"
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        hostPath:
          path: /mnt/models
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: aither
spec:
  selector:
    app: vllm-qwen
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-nodeport
  namespace: aither
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 32293
