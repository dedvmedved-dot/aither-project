# Aither Portal — nginx config with security hardening
# Port 3000 is NOT exposed — only accessible via nginx on :80/:443

server {
    listen 80;
    server_name _;

    # ── Security headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com https://avatars.yandex.net https://lh3.googleusercontent.com; connect-src 'self' https://api.github.com https://oauth2.googleapis.com https://oauth.yandex.ru https://login.yandex.ru; frame-src https://accounts.google.com;" always;
    # HSTS — uncomment when HTTPS is configured:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root for SPA
    root /usr/share/nginx/html;
    index index.html;

    # ── API and Auth — proxy to BFF (127.0.0.1:3000 only, not exposed) ──
    location /auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Static assets (cache-friendly) ──
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }
}

# Port 3000 blocked at BFF level — binds to 127.0.0.1 in production
