<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aither — Token‑as‑a‑Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #13131a;
  --bg-card-hover: #1a1a24;
  --bg-input: #0d0d14;
  --border: #1f1f2e;
  --border-focus: #4f46e5;
  --text: #e4e4ec;
  --text-muted: #71718a;
  --text-dim: #4a4a5e;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-glow: rgba(99,102,241,0.15);
  --green: #34d399;
  --green-bg: rgba(52,211,153,0.1);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.1);
  --yellow: #fbbf24;
  --yellow-bg: rgba(251,191,36,0.1);
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* Top accent glow */
body::after {
  content: '';
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 400px;
  background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ===== LAYOUT ===== */
#app { position:relative; z-index:1; }

/* ===== HEADER ===== */
.header {
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(10,10,15,0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display:flex; align-items:center; gap:32px; }
.logo {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, #6366f1, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: 12px;
  padding-left: 12px;
  border-left: 1px solid var(--border);
  opacity: 0.7;
  line-height: 1.3;
  max-width: 380px;
}
@media (max-width: 900px) { .header-subtitle { display: none; } }
.nav { display:flex; gap:4px; }
.nav-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.nav-btn:hover { color: var(--text); background: var(--bg-card); }
.nav-btn.active { color: var(--text); background: var(--bg-card); }
.header-right { display:flex; align-items:center; gap:12px; }
.user-name { font-size:14px; color:var(--text-muted); }
.btn-logout {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-logout:hover { color: var(--red); border-color: var(--red); }

/* ===== MAIN ===== */
.main { max-width: 1100px; margin: 0 auto; padding: 40px 32px; }
.main.chat-main-wrap { max-width: none; padding: 0; overflow: hidden; }

/* ===== LOGIN ===== */
.login-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 40px;
  width: 400px;
  max-width: 90vw;
  box-shadow: var(--shadow);
}
.login-card h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 8px;
}
.login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
.login-card input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
}
.login-card input:focus { border-color: var(--border-focus); }
.login-card button {
  width: 100%;
  margin-top: 16px;
  padding: 11px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
}
.login-card button:hover { background: var(--accent-hover); box-shadow: 0 0 20px var(--accent-glow); }
.login-error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

/* ===== PAGE HEADER ===== */
.page-header {
  margin-bottom: 32px;
}
.page-header h2 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.page-header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

/* ===== STATS GRID ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  transition: border-color 0.15s;
}
.stat-card:hover { border-color: var(--border-focus); }
.stat-label { font-size: 13px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-value { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
.stat-value.green { color: var(--green); }
.stat-value.accent { background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.stat-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

/* ===== CARDS ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.card-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-header h3 { font-size: 16px; font-weight: 600; }
.card-body { padding: 24px; }

/* ===== TABLE ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-card-hover); }

/* ===== BADGES ===== */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 500;
}
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
.badge-accent { background: var(--accent-glow); color: var(--accent-hover); }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 0 16px var(--accent-glow); }
.btn-secondary { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--border-focus); }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid transparent; }
.btn-danger:hover { border-color: var(--red); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ===== FORMS ===== */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
.form-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--border-focus); }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 40px 24px;
  color: var(--text-dim);
}
.empty-state-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state h4 { color: var(--text-muted); font-size: 15px; margin-bottom: 4px; }
.empty-state p { font-size: 13px; }

/* ===== KEY REVEAL ===== */
.key-reveal {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--green);
  word-break: break-all;
  margin-top: 8px;
  display: none;
}
.key-reveal-label { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; }

/* ===== TOAST ===== */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 14px;
  box-shadow: var(--shadow);
  animation: slideIn 0.2s ease-out;
  max-width: 400px;
}
.toast.success { border-left: 3px solid var(--green); }
.toast.error { border-left: 3px solid var(--red); }
@keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }

/* ===== MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  width: 480px;
  max-width: 90vw;
  box-shadow: var(--shadow);
}
.modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }

/* ===== LOADING ===== */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
  color: var(--text-dim);
  font-size: 14px;
}

/* ===== MONOSPACE CODE ===== */
code, .mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: var(--bg-input);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent-hover);
}

/* ===== CHART CONTAINER ===== */
.chart-container {
  position: relative;
  height: 280px;
  margin: 0 -8px;
}

/* ===== CHAT LAYOUT ===== */
.chat-container {
  display: flex;
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}
.chat-sidebar {
  width: 280px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--bg-card);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.chat-sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  min-height: 0;
}
.chat-sidebar-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 2px;
  transition: background 0.15s;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chat-sidebar-item:hover { background: var(--bg-card-hover); }
.chat-sidebar-item.active { background: var(--accent-glow); }
.chat-sidebar-item-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.chat-sidebar-item-date { font-size: 11px; color: var(--text-dim); margin-left: 8px; flex-shrink: 0; }
.chat-sidebar-item-del {
  color: var(--text-dim);
  margin-left: 6px;
  cursor: pointer;
  opacity: 0;
  font-size: 14px;
  flex-shrink: 0;
}
.chat-sidebar-item:hover .chat-sidebar-item-del { opacity: 1; }
.chat-sidebar-item-del:hover { color: var(--red); }

.chat-sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.chat-balance {
  font-size: 13px;
  color: var(--text-muted);
}
.chat-balance-val { color: var(--green); font-weight: 600; }
.chat-org-select {
  width: 100%;
  padding: 6px 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  margin-bottom: 8px;
}
.chat-model-select {
  width: 100%;
  padding: 6px 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
}

.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  min-height: 0;
}
.chat-messages-inner {
  max-width: 800px;
  margin: 0 auto;
}
.chat-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 16px;
  flex-direction: column;
  gap: 8px;
}
.chat-empty-icon { font-size: 48px; }

.chat-msg {
  margin-bottom: 24px;
  display: flex;
  gap: 12px;
}
.chat-msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.chat-msg-avatar.user { background: var(--accent-glow); }
.chat-msg-avatar.assistant { background: linear-gradient(135deg, #6366f1, #a78bfa); }
.chat-msg-content {
  flex: 1;
  font-size: 15px;
  line-height: 1.7;
  min-width: 0;
}
.chat-msg-content pre {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  overflow-x: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  margin: 8px 0;
}
.chat-msg-content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: var(--bg-input);
  padding: 2px 6px;
  border-radius: 4px;
}
.chat-msg-content pre code { background: none; padding: 0; }
.chat-msg-content p { margin: 0 0 8px 0; }
.chat-msg-content p:last-child { margin-bottom: 0; }
.chat-msg-content ul, .chat-msg-content ol { margin: 8px 0; padding-left: 20px; }
.chat-msg-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}
.chat-msg-streaming .chat-msg-content::after {
  content: '▊';
  animation: blink 1s infinite;
  color: var(--accent-hover);
}
@keyframes blink { 50% { opacity: 0; } }

.chat-input-area {
  padding: 16px 32px;
  border-top: 1px solid var(--border);
  max-width: 40%;
  margin: 0 auto;
  width: 100%;
  flex-shrink: 0;
}
.chat-input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  justify-content: center;
}
.chat-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  resize: none;
  outline: none;
  min-height: 44px;
  max-height: 200px;
  transition: border-color 0.15s;
}
.chat-input:focus { border-color: var(--border-focus); }
.chat-send-btn {
  padding: 10px 18px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: white;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  height: 44px;
}
.chat-send-btn:hover { background: var(--accent-hover); }
.chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.chat-input-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.chat-input-btn {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.chat-input-btn:hover { color: var(--text); border-color: var(--border-focus); }

/* ===== SHARE MODAL ===== */
.share-url {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--green);
  word-break: break-all;
  margin: 12px 0;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .header { padding: 0 16px; }
  .main { padding: 24px 16px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 24px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-container" id="toast-container"></div>

<script>
// ===== STATE =====
const state = {
  token: localStorage.getItem('aither_token'),
  user: null,
  page: 'dashboard',
  orgs: [],
  selectedOrg: null,
  apiKeys: [],
  usage: null,
  usageHistory: [],
  coreStatus: null,
  // Chat state
  chats: [],
  chatId: null,
  chatMessages: [],
  chatStreaming: false,
  chatOrgId: localStorage.getItem('aither_chat_org') || '',
  chatModel: localStorage.getItem('aither_chat_model') || 'qwen2.5-14b',
};

// ===== HELPERS =====
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => ctx.querySelectorAll(sel);

function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  return fetch(path, { headers, ...opts }).then(r => r.json().then(d => ({ ok: r.ok, status: r.status, data: d })));
}

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 200); }, 3500);
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('ru-RU', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function formatNumber(n) {
  if (n == null) return '0';
  return n.toLocaleString('ru-RU');
}

// ===== AUTH =====
async function checkAuth() {
  if (!state.token) return false;
  const { ok, data } = await api('/api/v1/me');
  if (ok && data.user) {
    state.user = data.user;
    return true;
  }
  state.token = null;
  localStorage.removeItem('aither_token');
  return false;
}

function logout() {
  state.token = null;
  state.user = null;
  localStorage.removeItem('aither_token');
  render();
}

// ===== RENDER =====
async function render() {
  if (!state.token || !(await checkAuth())) {
    renderLogin();
    return;
  }
  renderApp();
  switch (state.page) {
    case 'dashboard': await renderDashboard(); break;
    case 'orgs': await renderOrgs(); break;
    case 'org-detail': await renderOrgDetail(); break;
    case 'chats': await renderChats(); break;
    case 'shared': await renderShared(); break;
  }
}

    method: 'POST',

  });
  if (ok && data.delegation_token) {
    $('#delegate-result').style.display = 'block';
    $('#delegate-token-value').textContent = data.delegation_token;
    // Try to fetch usage
    await loadUsage(data.delegation_token);
  } else {
    toast((data||{}).error || 'Ошибка делегирования', 'error');
  }
}

  // Auto-create org if none
  if (state.orgs.length === 0) {
    const { ok: co, data: cd } = await api('/api/v1/orgs', { method:'POST', body: JSON.stringify({name:'Моя организация'}) });
    if (co && cd.org) {
      state.orgs = [cd.org];
      state.chatOrgId = cd.org.org_id;
      localStorage.setItem('aither_chat_org', state.chatOrgId);
      // Auto-create API key for new org
      await api('/api/v1/orgs/' + cd.org.org_id + '/api-keys', { method:'POST', body: JSON.stringify({name:'default'}) });
    }
  }

  if (!state.chatOrgId && state.orgs.length > 0) {
    state.chatOrgId = state.orgs[0].org_id;
    localStorage.setItem('aither_chat_org', state.chatOrgId);
  }

  // Auto-create chat if none selected
  if (!state.chatId) {
    // Load existing chats
    const { ok: lcOk } = await api('/api/v1/chats');
    if (lcOk) {
      // If no chats exist, create one
      const { ok: ncOk, data: ncData } = await api('/api/v1/chats', { method:'POST', body: JSON.stringify({model: state.chatModel}) });
      if (ncOk && ncData.chat) {
        state.chatId = ncData.chat.chat_id;
        state.chatMessages = [];
      }
    }
  }

  let mainHtml = `
    <div class="chat-container">
    <div class="chat-sidebar">
      <div class="chat-sidebar-header">
        <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="newChat()">+ Новый чат</button>
        <select class="chat-model-select" id="chat-model-select" onchange="onChatModelChange(this.value)">
          <option value="qwen2.5-14b" ${state.chatModel==='qwen2.5-14b'?'selected':''}>Qwen 2.5 14B</option>
        </select>
        <select class="chat-org-select" id="chat-org-select" onchange="onChatOrgChange(this.value)" style="margin-top:6px;">
          ${state.orgs.map(o => `<option value="${esc(o.org_id)}" ${state.chatOrgId===o.org_id?'selected':''}>${esc(o.name)}</option>`).join('')}
        </select>
        <div class="chat-balance" id="chat-balance" style="margin-top:8px;">Баланс: —</div>
      </div>
      <div class="chat-sidebar-list" id="chat-list"></div>
    </div>
    <div class="chat-main">
      <div class="chat-messages" id="chat-messages">
        ${state.chatId ? '<div class="loading">Загрузка...</div>' : '<div class="chat-empty"><div class="chat-empty-icon">💬</div><div>Создаю чат...</div></div>'}
      </div>
      <div class="chat-input-area">
        <div class="chat-input-row">
          <textarea class="chat-input" id="chat-input" placeholder="Введите сообщение..." rows="1" onkeydown="onChatKey(event)"></textarea>
          <button class="chat-send-btn" id="chat-send-btn" onclick="sendChat()">▶</button>
        </div>
        <div class="chat-input-actions">
          <button class="chat-input-btn" onclick="shareChat()">🔗 Поделиться</button>
        </div>
      </div>
    </div>
  </div>`;

  $('#main-content').innerHTML = mainHtml;

  await loadChatList();
  loadBalance();

  if (state.chatId) {
    await loadChatMessages(state.chatId);
  } else {
    renderMessages();
  }
}

async function loadChatList() {
  const { ok, data } = await api('/api/v1/chats');
  if (ok) {
    state.chats = data.chats || [];
    const list = $('#chat-list');
    if (list) {
      list.innerHTML = state.chats.map(c => `
        <div class="chat-sidebar-item ${state.chatId===c.chat_id?'active':''}" onclick="selectChat('${c.chat_id}')">
          <span class="chat-sidebar-item-title">${esc(c.title)}</span>
          <span class="chat-sidebar-item-date">${formatDateShort(c.updated_at)}</span>
          <span class="chat-sidebar-item-del" onclick="event.stopPropagation();deleteChat('${c.chat_id}')">×</span>
        </div>
      `).join('');
    }
  }
}

function formatDateShort(d) {
  if (!d) return '';
  const dt = new Date(d);
  const now = new Date();
  if (dt.toDateString() === now.toDateString())
    return dt.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
  return dt.toLocaleDateString('ru-RU', {day:'numeric',month:'short'});
}

async function loadBalance() {
  if (!state.chatOrgId) return;
  const { ok, data } = await api(`/api/v1/billing?org_id=${state.chatOrgId}`);
  const bal = $('#chat-balance');
  if (bal && ok) {
    bal.innerHTML = `Баланс: <span class="chat-balance-val">${formatNumber(data.balance || 0)}</span> токенов`;
  }
}

function onChatOrgChange(val) {
  state.chatOrgId = val;
  localStorage.setItem('aither_chat_org', val);
  state.chatId = null;
  state.chatMessages = [];
  renderChats();
}

function onChatModelChange(val) {
  state.chatModel = val;
  localStorage.setItem('aither_chat_model', val);
}

async function newChat() {
  const { ok, data } = await api('/api/v1/chats', { method:'POST', body: JSON.stringify({model: state.chatModel}) });
  if (ok) {
    state.chatId = data.chat.chat_id;
    state.chatMessages = [];
    await renderChats();
    focusInput();
  }
}

async function selectChat(id) {
  state.chatId = id;
  await renderChats();
  focusInput();
}

async function deleteChat(id) {
  if (!confirm('Удалить чат?')) return;
  await api(`/api/v1/chats/${id}`, { method:'DELETE' });
  if (state.chatId === id) { state.chatId = null; state.chatMessages = []; }
  await loadChatList();
  if (!state.chatId) {
    // Show empty state, don't auto-create
    const msgEl = $('#chat-messages');
    if (msgEl) msgEl.innerHTML = '<div class="chat-messages-inner"><div class="chat-empty"><div class="chat-empty-icon">💬</div><div>Выберите или создайте новый чат</div></div></div>';
    const balEl = $('#chat-balance');
    if (balEl) balEl.innerHTML = 'Баланс: —';
  }
}

async function loadChatMessages(chatId) {
  const { ok, data } = await api(`/api/v1/chats/${chatId}`);
  if (!ok) return;
  state.chatMessages = data.messages || [];
  renderMessages();
  scrollToBottom();
}

function renderMessages() {
  const el = $('#chat-messages');
  if (!el) return;
  if (state.chatMessages.length === 0) {
    el.innerHTML = '<div class="chat-messages-inner"><div class="chat-empty"><div class="chat-empty-icon">💬</div><div>Начните диалог</div></div></div>';
    return;
  }
  el.innerHTML = '<div class="chat-messages-inner">' + state.chatMessages.map((m, i) => {
    const isStreaming = state.chatStreaming && i === state.chatMessages.length - 1 && m.role === 'assistant';
    return `
      <div class="chat-msg ${isStreaming ? 'chat-msg-streaming' : ''}">
        <div class="chat-msg-avatar ${m.role}">${m.role==='user'?'👤':'🤖'}</div>
        <div>
          <div class="chat-msg-content">${simpleMd(m.content)}</div>
          ${m.tokens_used ? `<div class="chat-msg-meta">~${m.tokens_used} токенов</div>` : ''}
        </div>
      </div>`;
  }).join('') + '</div>';
  if (typeof hljs !== 'undefined') hljs.highlightAll();
}

function simpleMd(text) {
  if (!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code class="language-${lang || 'plaintext'}">${code}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n/g, '<br>');
}

async function sendChat() {
  if (state.chatStreaming) return;
  const input = $('#chat-input');
  const content = input.value.trim();
  if (!content) return;

  // Auto-create chat if none
  if (!state.chatId) {
    const { ok, data } = await api('/api/v1/chats', { method:'POST', body: JSON.stringify({model: state.chatModel}) });
    if (!ok) { toast('Не удалось создать чат', 'error'); return; }
    state.chatId = data.chat.chat_id;
    state.chatMessages = [];
    await loadChatList();
  }

  input.value = '';
  input.style.height = 'auto';
  $('#chat-send-btn').disabled = true;
  state.chatStreaming = true;

  // Add user message locally
  state.chatMessages.push({ role: 'user', content });
  renderMessages();
  scrollToBottom();

  // Add placeholder for assistant
  state.chatMessages.push({ role: 'assistant', content: '' });
  renderMessages();
  scrollToBottom();

  try {
    const response = await fetch(`/api/v1/chats/${state.chatId}/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + state.token,
      },
      body: JSON.stringify({ content, org_id: state.chatOrgId }),
    });

    if (!response.ok) {
      const err = await response.json();
      state.chatMessages.pop(); // remove placeholder
      state.chatMessages.pop(); // remove user msg (will be fixed on reload)
      renderMessages();
      toast(err.error || 'Ошибка', 'error');
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        try {
          const parsed = JSON.parse(data);
          if (parsed.done) {
            // Reload chat to get server-saved messages
            await loadChatMessages(state.chatId);
            break;
          }
          if (parsed.delta) {
            const last = state.chatMessages[state.chatMessages.length - 1];
            if (last && last.role === 'assistant') {
              last.content += parsed.delta;
              renderMessages();
              scrollToBottom();
            }
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    toast('Ошибка соединения', 'error');
    state.chatMessages.pop();
    state.chatMessages.pop();
    renderMessages();
  } finally {
    state.chatStreaming = false;
    $('#chat-send-btn').disabled = false;
    await loadChatList();
    loadBalance();
    focusInput();
  }
}

function onChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

function focusInput() {
  setTimeout(() => {
    const inp = $('#chat-input');
    if (inp) inp.focus();
  }, 100);
}

function scrollToBottom() {
  setTimeout(() => {
    const el = $('#chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

async function shareChat() {
  if (!state.chatId) { toast('Сначала отправьте сообщение', 'error'); return; }
  const { ok, data } = await api(`/api/v1/chats/${state.chatId}/share`, { method:'POST' });
  if (!ok) { toast('Ошибка', 'error'); return; }
  const url = window.location.origin + '/shared/' + data.share_token;

  // Show modal
  const modal = document.createElement('div');
  modal.className = 'modal-overlay active';
  modal.innerHTML = `
    <div class="modal">
      <h3>🔗 Ссылка на чат</h3>
      <p style="color:var(--text-muted);font-size:14px;">Скопируйте ссылку чтобы поделиться чатом:</p>
      <div class="share-url">${esc(url)}</div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${esc(url)}').then(()=>this.closest('.modal-overlay').remove()); this.closest('.modal-overlay').remove()">📋 Копировать</button>
        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Закрыть</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

// ===== SHARED VIEW =====
async function renderShared() {
  const token = window.location.pathname.split('/shared/')[1];
  if (!token) { navigate('chats'); return; }

  const resp = await fetch(`/api/v1/shared/${token}`);
  const data = await resp.json();

  $('#app').innerHTML = `
    <div class="header">
      <div class="header-left">
        <span class="logo">Aither</span>
        <span style="color:var(--text-dim);font-size:14px;">Общий чат</span>
      </div>
      <div class="header-right">
        <button class="btn btn-primary btn-sm" onclick="navigate('chats')">Войти в Aither</button>
      </div>
    </div>
    <div class="main" style="max-width:800px;">
      <div class="page-header">
        <h2>${esc(data.chat?.title || 'Чат')}</h2>
        <p>Модель: ${esc(data.chat?.model || '—')} · ${formatDate(data.chat?.created_at)}</p>
      </div>
      ${(data.messages||[]).map(m => `
        <div class="chat-msg">
          <div class="chat-msg-avatar ${m.role}">${m.role==='user'?'👤':'🤖'}</div>
          <div>
            <div class="chat-msg-content">${simpleMd(m.content)}</div>
          </div>
        </div>
      `).join('')}
    </div>`;
}

// ===== INIT =====
if (window.location.pathname.startsWith('/shared/')) {
  state.page = 'shared';
}
render();
</script>
