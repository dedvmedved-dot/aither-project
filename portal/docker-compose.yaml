version: "3.9"

services:
  portal-db:
    image: postgres:16-alpine
    container_name: portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal-secret
      POSTGRES_DB: portal
    volumes:
      - portal_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal-bff:
    build: ./bff
    container_name: portal-bff
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://portal:portal-secret@portal-db:5432/portal
      CORE_API_URL: http://10.129.13.78:30900/v1
      CORE_API_TOKEN: dev-delegation-token
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      portal-db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portal-bff

volumes:
  portal_db_data:
