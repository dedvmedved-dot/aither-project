version: "3.8"
services:
  portal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      retries: 5

  portal-bff:
    build: .
    environment:
      NODE_ENV: production
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      PG_USER: portal
      PG_PASSWORD: portal
      PG_DB: portal
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      CORE_API: "http://10.129.13.78:30900"
      PUBLIC_HOST: "130.17.1.90"
      CORS_ORIGIN: "http://130.17.1.90"
    network_mode: host
    depends_on:
      portal-db:
        condition: service_healthy

  portal-nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - portal-bff
    network_mode: host

volumes:
  portal_pgdata:
