apiVersion: v1
kind: Pod
metadata:
  name: vllm-qwen14b
  namespace: default
  labels:
    app: vllm
spec:
  runtimeClassName: nvidia
  containers:
  - name: vllm
    image: vllm/vllm-openai:latest
    command:
    - python3
    - -m
    - vllm.entrypoints.openai.api_server
    - --model
    - /models/Qwen2.5-Coder-14B
    - --served-model-name
    - qwen2.5-coder-14b
    - --host
    - 0.0.0.0
    - --port
    - 8000
    - --max-model-len
    - 8192
    - --gpu-memory-utilization
    - "0.90"
    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: "0"
    ports:
    - containerPort: 8000
    volumeMounts:
    - name: models
      mountPath: /models
  volumes:
  - name: models
    hostPath:
      path: /data/models
  nodeSelector:
    kubernetes.io/hostname: bootsman-k8s-clnt01-n8-gpu
