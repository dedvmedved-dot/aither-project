apiVersion: v1
kind: Pod
metadata:
  name: vllm-coder-14b
  namespace: default
  labels:
    app: vllm-coder-14b
spec:
  runtimeClassName: nvidia
  nodeName: bootsman-k8s-clnt01-n8-gpu
  containers:
  - name: vllm
    image: vllm/vllm-openai:v0.8.5
    imagePullPolicy: IfNotPresent
    command:
    - python3
    - -m
    - vllm.entrypoints.openai.api_server
    - --model
    - /models/Qwen2.5-Coder-14B-Instruct
    - --tensor-parallel-size
    - "2"
    - --dtype
    - half
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --max-model-len
    - "8192"
    ports:
    - containerPort: 8000
      name: api
    volumeMounts:
    - name: models
      mountPath: /models
    - name: dshm
      mountPath: /dev/shm
    resources:
      limits:
        memory: "48Gi"
        cpu: "16"
      requests:
        memory: "32Gi"
        cpu: "8"
  volumes:
  - name: models
    hostPath:
      path: /data/models
      type: Directory
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-coder-14b
  namespace: default
spec:
  selector:
    app: vllm-coder-14b
  ports:
  - port: 8000
    targetPort: 8000
    name: api
  type: ClusterIP
