server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to BFF (handles auth, tokens, models, chat)
    location /api/ {
        proxy_pass http://aither-bff:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # Health / Ready checks
    location /health {
        proxy_pass http://aither-bff:8000/health;
        proxy_set_header Host $host;
    }
    location /ready {
        proxy_pass http://aither-bff:8000/health;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
