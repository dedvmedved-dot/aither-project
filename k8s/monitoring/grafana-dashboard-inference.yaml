apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-inference
  namespace: monitoring
  labels:
    grafana_dashboard: "inference"
data:
  inference.json: |
    {
      "title": "vLLM Inference",
      "uid": "aither-inference",
      "panels": [
        {
          "title": "Requests / sec",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "rate(vllm_request_total[1m])",
            "legendFormat": "{{model}}"
          }]
        },
        {
          "title": "Tokens / sec",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "rate(vllm_generation_tokens_total[1m])",
            "legendFormat": "{{model}}"
          }]
        },
        {
          "title": "KV Cache Usage %",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{
            "expr": "vllm_gpu_cache_usage_perc",
            "legendFormat": "{{model}}"
          }],
          "fieldConfig": {
            "defaults": {"unit": "percent", "min": 0, "max": 100}
          }
        },
        {
          "title": "Queue Size",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{
            "expr": "vllm_num_requests_running",
            "legendFormat": "{{model}} running"
          }, {
            "expr": "vllm_num_requests_waiting",
            "legendFormat": "{{model}} waiting"
          }]
        },
        {
          "title": "TTFT (Time To First Token) ms",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [{
            "expr": "histogram_quantile(0.5, rate(vllm_time_to_first_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p50"
          }, {
            "expr": "histogram_quantile(0.95, rate(vllm_time_to_first_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p95"
          }],
          "fieldConfig": {
            "defaults": {"unit": "ms"}
          }
        },
        {
          "title": "Latency per Token (ms)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [{
            "expr": "histogram_quantile(0.5, rate(vllm_time_per_output_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p50"
          }, {
            "expr": "histogram_quantile(0.95, rate(vllm_time_per_output_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p95"
          }],
          "fieldConfig": {
            "defaults": {"unit": "ms"}
          }
        }
      ],
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"}
    }
