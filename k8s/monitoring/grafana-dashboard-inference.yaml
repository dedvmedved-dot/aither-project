apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-inference
  namespace: monitoring
  labels:
    grafana_dashboard: "inference"
data:
  inference.json: |
    {
      "title": "vLLM Inference",
      "uid": "aither-inference",
      "panels": [
        {
          "title": "Requests / sec",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "rate(vllm:request_success_total[1m])",
            "legendFormat": "{{model}}"
          }]
        },
        {
          "title": "Generation Tokens / sec",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "rate(vllm:generation_tokens_total[1m])",
            "legendFormat": "{{model}}"
          }]
        },
        {
          "title": "KV Cache Usage %",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{
            "expr": "vllm:kv_cache_usage_perc",
            "legendFormat": "{{model}}"
          }],
          "fieldConfig": {
            "defaults": {"unit": "percent", "min": 0, "max": 100}
          }
        },
        {
          "title": "Queue Size",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{
            "expr": "vllm:num_requests_running",
            "legendFormat": "{{model}} running"
          }, {
            "expr": "vllm:num_requests_waiting",
            "legendFormat": "{{model}} waiting"
          }]
        },
        {
          "title": "TTFT p50/p95 (ms)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [{
            "expr": "histogram_quantile(0.5, rate(vllm:time_to_first_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p50"
          }, {
            "expr": "histogram_quantile(0.95, rate(vllm:time_to_first_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p95"
          }],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        },
        {
          "title": "Time Per Output Token p50/p95 (ms)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [{
            "expr": "histogram_quantile(0.5, rate(vllm:request_time_per_output_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p50"
          }, {
            "expr": "histogram_quantile(0.95, rate(vllm:request_time_per_output_token_seconds_bucket[5m])) * 1000",
            "legendFormat": "{{model}} p95"
          }],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        }
      ],
      "refresh": "10s"
    }
