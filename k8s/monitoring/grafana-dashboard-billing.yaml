apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-billing
  namespace: monitoring
  labels:
    grafana_dashboard: "billing"
data:
  billing.json: |
    {
      "title": "Aither Billing",
      "uid": "aither-billing",
      "panels": [
        {
          "title": "Gateway Requests / min",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "rate(gateway_requests_total[1m]) * 60",
            "legendFormat": "{{model}}"
          }]
        },
        {
          "title": "Gateway Errors (4xx/5xx)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "rate(gateway_errors_total[1m])",
            "legendFormat": "{{status}} {{model}}"
          }]
        },
        {
          "title": "Gateway Latency p50/p95 (ms)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{
            "expr": "histogram_quantile(0.5, rate(gateway_request_duration_seconds_bucket[5m])) * 1000",
            "legendFormat": "p50"
          }, {
            "expr": "histogram_quantile(0.95, rate(gateway_request_duration_seconds_bucket[5m])) * 1000",
            "legendFormat": "p95"
          }],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        },
        {
          "title": "Tokens Billed / min",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{
            "expr": "rate(gateway_tokens_billed_total[1m]) * 60",
            "legendFormat": "{{model}}"
          }]
        },
        {
          "title": "Active Rate Limits",
          "type": "stat",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 16},
          "targets": [{
            "expr": "sum(gateway_rate_limited_total)",
            "legendFormat": "Rate limited"
          }]
        },
        {
          "title": "Active Orgs",
          "type": "stat",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 16},
          "targets": [{
            "expr": "gateway_active_orgs",
            "legendFormat": "Orgs"
          }]
        },
        {
          "title": "DLP Blocks",
          "type": "stat",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 16},
          "targets": [{
            "expr": "rate(gateway_dlp_blocks_total[5m])",
            "legendFormat": "Blocks/min"
          }]
        }
      ],
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"}
    }
