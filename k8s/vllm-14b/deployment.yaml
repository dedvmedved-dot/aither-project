      {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{},"name":"vllm-qwen","namespace":"default"},"spec":{"replicas":1,"selector":{"matchLabels":{"app":"vllm-qwen"}},"template":{"metadata":{"labels":{"app":"vllm-qwen"}},"spec":{"containers":[{"args":["--model","/models/Qwen2.5-14B-Instruct","--dtype","half","--max-model-len","4096","--gpu-memory-utilization","0.90","--tensor-parallel-size","2","--enforce-eager"],"command":["python3","-m","vllm.entrypoints.openai.api_server"],"env":[{"name":"HF_HUB_OFFLINE","value":"1"},{"name":"VLLM_PORT","value":"8000"},{"name":"NVIDIA_VISIBLE_DEVICES","value":"all"},{"name":"NVIDIA_DRIVER_CAPABILITIES","value":"compute,utility"}],"image":"vllm/vllm-openai:v0.8.5","name":"vllm","ports":[{"containerPort":8000}],"volumeMounts":[{"mountPath":"/models","name":"models"}]}],"nodeSelector":{"kubernetes.io/hostname":"bootsman-k8s-clnt01-n8-gpu"},"runtimeClassName":"nvidia","volumes":[{"hostPath":{"path":"/data/models"},"name":"models"}]}}}}
  name: vllm-qwen
  namespace: default
spec:
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vllm-qwen
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      containers:
      - args:
        - --model
        - /models/Qwen2.5-14B-Instruct
        - --dtype
        - half
        - --max-model-len
        - "4096"
        - --gpu-memory-utilization
        - "0.90"
        - --tensor-parallel-size
        - "2"
        - --enable-lora
        - --lora-modules
        - astra-14b=/models/lora-qwen14b-astra/
