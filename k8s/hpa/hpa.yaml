# ═══════════════════════════════════════════════════════════════
# Aither Platform — HPA Configuration
# ═══════════════════════════════════════════════════════════════
#
# Native Kubernetes HPAs based on metrics-server (CPU/Memory).
# GPU-based HPA requires prometheus-adapter + pod-level DCGM labels
# and is documented in docs/hpa-gpu-scaling.md.
#
# Current limitations:
# - vLLM pods use 2 dedicated GPUs each; max 1 per node (only 2 GPUs)
# - Scaling vLLM beyond 2 replicas requires adding GPU nodes
# - Gateway is stateless — can scale horizontally within node CPU limits
# ═══════════════════════════════════════════════════════════════

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-14b-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-qwen
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85

