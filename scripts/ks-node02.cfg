# Kickstart for RED OS 8.0.2 — Aither Node01 (10.129.13.172)
# Автоматическая установка Kubernetes-узла
# Использование: добавить в grub: inst.ks=http://10.129.100.235:8888/ks-node02.cfg

lang ru_RU.UTF-8
keyboard ru
timezone Europe/Moscow --utc

# Сеть: VLAN 308, статический IP
network --bootproto=static --device=link --ip=10.129.13.172 --netmask=255.255.255.0 --gateway=10.129.13.1 --nameserver=10.129.13.65 --hostname=node02.aither.local --activate

# Пароль root (сменить после установки!)
rootpw --iscrypted $6$rounds=4096$A1b2C3d4E5$placeholder.change.me.now
user --name=admin --groups=wheel --password=$6$rounds=4096$A1b2C3d4E5$placeholder.change.me.now --iscrypted

# Разметка дисков
# MegaRAID: 2× 1.746TB SSD (sda) + 10× 3.492TB SSD (sdb)
# M.2: 2× 480GB SSD (nvme0n1)
# Стратегия: M.2 под ОС + /var/lib/docker, SSD-массивы под данные
zerombr
clearpart --all --initlabel

# M.2 — система и контейнеры
part /boot --fstype=xfs --size=1024 --ondisk=nvme0n1
part /boot/efi --fstype=efi --size=512 --ondisk=nvme0n1
part pv.01 --size=1 --grow --ondisk=nvme0n1
volgroup vg_system pv.01
logvol / --fstype=xfs --name=root --vgname=vg_system --size=51200
logvol /var --fstype=xfs --name=var --vgname=vg_system --size=20480
logvol /var/lib/docker --fstype=xfs --name=docker --vgname=vg_system --size=51200
logvol swap --fstype=swap --name=swap --vgname=vg_system --size=16384

# SSD массив 2×1.746TB (sda) — быстрые данные
part pv.02 --size=1 --grow --ondisk=sda
volgroup vg_fast pv.02
logvol /data/fast --fstype=xfs --name=fast --vgname=vg_fast --size=1 --grow

# SSD массив 10×3.492TB (sdb) — холодные данные
part pv.03 --size=1 --grow --ondisk=sdb
volgroup vg_bulk pv.03
logvol /data/bulk --fstype=xfs --name=bulk --vgname=vg_bulk --size=1 --grow

# Запрет на установку загрузчика на SSD-массивы
bootloader --location=mbr --boot-drive=nvme0n1

# Пакеты: серверный профиль + драйверы NVIDIA + K8s-зависимости
%packages
@^server-product-environment
@container-management
@network-file-system-client
@system-tools
kernel-devel
kernel-headers
dkms
gcc
make
elfutils-libelf-devel
wget
curl
vim
git
rsync
nfs-utils
lvm2
xfsprogs
mdadm
net-tools
bind-utils
tcpdump
chrony
firewalld
selinux-policy-targeted
policycoreutils-python-utils
conntrack-tools
socat
ipvsadm
ebtables
ethtool
%end

# Постустановочный скрипт
%post --log=/root/kickstart-post.log

exec > /root/kickstart-post.log 2>&1
set -x

echo "=== Kickstart post-install for node02 ==="
date

# Настройка chrony (тот же NTP что DNS)
echo "server 10.129.13.65 iburst" > /etc/chrony.conf
systemctl enable chronyd

# Отключаем swap (требование K8s)
swapoff -a
sed -i '/swap/d' /etc/fstab

# Настройка модулей ядра для K8s
cat > /etc/modules-load.d/k8s.conf <<EOF
overlay
br_netfilter
EOF

modprobe overlay
modprobe br_netfilter

# sysctl для K8s
cat > /etc/sysctl.d/99-k8s.conf <<EOF
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward                 = 1
EOF
sysctl --system

# Отключаем SELinux (K8s пока не совместим полностью)
# При необходимости: setenforce 0 + sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config
setenforce 0
sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config

# Firewalld: открываем порты K8s
firewall-cmd --permanent --add-port=6443/tcp                    # kube-apiserver
firewall-cmd --permanent --add-port=2379-2380/tcp               # etcd
firewall-cmd --permanent --add-port=10250/tcp                   # kubelet
firewall-cmd --permanent --add-port=10251/tcp                   # kube-scheduler
firewall-cmd --permanent --add-port=10252/tcp                   # kube-controller-manager
firewall-cmd --permanent --add-port=10255/tcp                   # kubelet read-only
firewall-cmd --permanent --add-port=30000-32767/tcp             # NodePort services
firewall-cmd --permanent --add-port=179/tcp                     # Calico BGP
firewall-cmd --permanent --add-port=4789/udp                    # Calico VXLAN
firewall-cmd --permanent --add-port=5473/tcp                    # Calico Typha
firewall-cmd --reload

# Создаём точку монтирования для данных
mkdir -p /data/fast /data/bulk

echo "=== Kickstart post-install DONE ==="

%end

reboot
