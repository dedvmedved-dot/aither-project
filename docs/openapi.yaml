openapi: "3.0.3"
info:
  title: Aither API
  description: |
    OpenAI-совместимое API для доступа к LLM-моделям платформы Aither.
    Аутентификация: API-ключ в заголовке `Authorization: Bearer ***`.

    **Получение API-ключа:** в веб-портале → Настройки организации → API-ключи.
  version: "1.0.0"
  contact:
    name: Aither Team
    email: support@aither.local

servers:
  - url: https://aither.example.com
    description: Production (VPS1 nginx)
  - url: http://localhost:3000
    description: Development (Portal BFF directly)

security:
  - ApiKeyAuth: []

paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [System]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: aither-api
                  version:
                    type: string
                    example: "1.0"

  /api/v1/models:
    get:
      summary: List available models
      operationId: listModels
      tags: [Models]
      security: []
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"

  /api/v1/chat/completions:
    post:
      summary: Create chat completion
      description: OpenAI-совместимый эндпоинт. Поддерживает streaming (SSE).
      operationId: createChatCompletion
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  description: Model ID (qwen2.5-14b, qwen2.5-32b)
                  example: qwen2.5-14b
                messages:
                  type: array
                  items:
                    $ref: "#/components/schemas/Message"
                max_tokens:
                  type: integer
                  default: 2048
                  maximum: 8192
                temperature:
                  type: number
                  default: 0.7
                  minimum: 0
                  maximum: 2
                stream:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Chat completion (non-streaming)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
        "Streaming":
          description: SSE stream of delta chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key в формате `ak-...`

  schemas:
    Model:
      type: object
      properties:
        id:
          type: string
          example: qwen2.5-14b
        object:
          type: string
          example: model
        owned_by:
          type: string
          example: aither
        display_name:
          type: string
          example: Qwen 2.5 14B
        description:
          type: string
        max_tokens:
          type: integer

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string

    ChatCompletion:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: "#/components/schemas/Message"
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: integer

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayError:
      description: Gateway unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
