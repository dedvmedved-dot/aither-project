apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: python:3.12-slim
        command: ["sh", "-c"]
        args:
        - pip install -q redis pyjwt psycopg2-binary cryptography && python3 /app/gateway.py
        env:
        - name: VLLM_URL
          value: http://vllm:8000
        - name: REDIS_URL
          value: redis
        - name: RATE_LIMIT
          value: "60"
        - name: PORT
          value: "8080"
        - name: TOKEN_COST
          value: "1"
        - name: PG_URL
          valueFrom:
            secretKeyRef:
              name: pg-url
              key: url
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /app
          name: code
        - mountPath: /app/delegation
          name: delegation-key
      volumes:
      - name: code
        configMap:
          name: gateway-code
      - name: delegation-key
        configMap:
          name: delegation-public-key
