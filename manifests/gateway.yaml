apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-code
data:
  gateway.py: |
    __GATEWAY_PY__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: python:3.12-slim
        command: ["sh", "-c"]
        args:
        - |
          pip install -q redis && python3 /app/gateway.py
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VLLM_URL
          value: "http://vllm:8000"
        - name: REDIS_URL
          value: "redis"
        - name: RATE_LIMIT
          value: "60"
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: code
          mountPath: /app
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: code
        configMap:
          name: gateway-code
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
    name: http
