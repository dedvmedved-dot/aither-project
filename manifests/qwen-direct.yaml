apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-direct
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen-direct
  template:
    metadata:
      labels:
        app: vllm-qwen-direct
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - "--model"
        - "/models/Qwen2.5-14B-Instruct"
        - "--dtype"
        - "half"
        - "--max-model-len"
        - "4096"
        - "--gpu-memory-utilization"
        - "0.90"
        - "--tensor-parallel-size"
        - "2"
        - "--enforce-eager"
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          value: "hf_dummy"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: VLLM_PORT
          value: "8000"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "16"
            memory: "48Gi"
          requests:
            cpu: "8"
            memory: "24Gi"
        volumeMounts:
        - name: models
          mountPath: /models
      volumes:
      - name: models
        hostPath:
          path: /data/models
      nodeSelector:
        kubernetes.io/hostname: bootsman-k8s-clnt01-n8-gpu
