# Alertmanager — Aither observability stack (D1)
# Source of truth for the monitoring namespace Alertmanager deployment.
# Reconciles the live cluster state (OPS-RC1 R2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: 'default'
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 30s
      repeat_interval: 4h
    receivers:
    - name: 'default'
      # Telegram delivery is BLOCKED (OPS-RC1 D1): no Telegram bot_token/chat_id
      # Secret exists in the cluster. To enable, supply the credentials via a
      # Kubernetes Secret and reference them here — never commit the values:
      #   telegram_configs:
      #   - bot_token: '<secret>'
      #     chat_id: <secret>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
        - "--config.file=/etc/alertmanager/alertmanager.yml"
        - "--storage.path=/alertmanager"
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: data
          mountPath: /alertmanager
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
