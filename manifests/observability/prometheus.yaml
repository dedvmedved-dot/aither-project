# Prometheus — Aither observability stack
# Source of truth for the monitoring namespace Prometheus deployment.
# Reconciles the live cluster state (OPS-RC1 R2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager.monitoring.svc:9093']

    rule_files:
      - /etc/prometheus/rules/*.rules

    scrape_configs:
    - job_name: 'dcgm-exporter'
      static_configs:
      - targets: ['nvidia-dcgm-exporter.gpu-operator.svc:9400']
      metric_relabel_configs:
      - source_labels: [Hostname]
        target_label: node

    - job_name: 'node-exporter'
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [monitoring]
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app]
        action: keep
        regex: node-exporter

    - job_name: 'kube-state-metrics'
      static_configs:
      - targets: ['kube-state-metrics.monitoring.svc:8080']

    - job_name: 'vllm'
      metrics_path: /metrics
      static_configs:
      - targets: ['vllm-32b-instruct-awq.aither-inference.svc:8000']
        labels:
          model: 'qwen2.5-32b-instruct'
          node: 'n7'
      - targets: ['vllm-qwen3-32b-awq.aither-inference.svc:8000']
        labels:
          model: 'qwen3-32b'
          node: 'n8'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.rules: |
    groups:
    - name: gpu
      rules:
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU temperature > 85°C"
          description: "GPU {{ $labels.gpu }} on node {{ $labels.node }} is at {{ $value }}°C"
      - alert: GPUMemoryPressure
        expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU memory pressure > 90%"
          description: "GPU {{ $labels.gpu }} on node {{ $labels.node }} is at {{ $value }}% framebuffer usage"
    - name: node
      rules:
      - alert: ClockOffsetHigh
        expr: abs(node_timex_offset_seconds) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NTP clock offset exceeds 5s"
          description: "Node {{ $labels.instance }} clock offset is {{ $value }} seconds (threshold 5s)"
    - name: kubernetes
      rules:
      - alert: PodRestartAnomaly
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restart anomaly"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) restarted {{ $value }} times in the last 1h"
    - name: test
      rules:
      - alert: SyntheticTestAlert
        expr: vector(1) == 1
        for: 1m
        labels:
          severity: none
          test: "true"
        annotations:
          summary: "Synthetic test alert"
          description: "Safe synthetic alert validating the Prometheus -> Alertmanager path"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=7d"
        - "--web.enable-lifecycle"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: prometheus-rules
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30909
