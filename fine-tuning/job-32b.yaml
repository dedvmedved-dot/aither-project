apiVersion: batch/v1
kind: Job
metadata:
  name: lora-train-32b
  labels:
    app: lora-training-32b
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeName: bootsman-k8s-clnt01-n8-gpu
      restartPolicy: Never
      containers:
      - name: trainer
        image: vllm/vllm-openai:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== Установка зависимостей ==="
          pip install peft datasets --quiet

          echo "=== QLoRA 32B ==="
          export HF_HOME=/mnt/models/.cache

          mkdir -p /data
          cp /training-data/dataset.jsonl /data/dataset.jsonl
          cp /training-data/train.py /data/train.py

          cd /data
          python3 train.py

          echo "=== Проверка ==="
          ls -la /mnt/models/lora-qwen32b-astra/
          echo "=== ГОТОВО ==="

        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "1"

        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: 16
          requests:
            nvidia.com/gpu: 1
            memory: 32Gi
            cpu: 8

        volumeMounts:
        - name: models
          mountPath: /mnt/models
        - name: training-data
          mountPath: /training-data

      volumes:
      - name: models
        hostPath:
          path: /mnt/models
          type: DirectoryOrCreate
      - name: training-data
        configMap:
          name: lora-32b-files
