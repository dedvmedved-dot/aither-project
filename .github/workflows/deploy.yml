name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'k8s/**'
      - 'configs/**'
      - 'portal/**'
      - 'scripts/deploy.sh'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy (gateway/vllm/portal/all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - gateway
          - vllm
          - portal
          - config

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-gateway

jobs:
  # ── Gateway: build + push Docker image ──
  build-gateway:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.component == 'all' || github.event.inputs.component == 'gateway')
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to K8s via VPS2 ──
  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-gateway
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-deploy]')) ||
      (github.event_name == 'workflow_dispatch' && needs.build-gateway.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Gateway image
        if: |
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.component == 'all' || github.event.inputs.component == 'gateway')
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          script: |
            IMAGE="ghcr.io/${{ github.repository }}-gateway:sha-${{ github.sha }}"
            echo "🚀 Deploying Gateway: $IMAGE"

            cd /root/aither-project
            git pull origin main

            # Update K8s deployment
            kubectl set image deployment/gateway gateway="$IMAGE" -n default

            # Wait for rollout
            if kubectl rollout status deployment/gateway -n default --timeout=120s; then
              echo "✅ Gateway deployed successfully"
            else
              echo "❌ Gateway rollout failed — rolling back"
              kubectl rollout undo deployment/gateway -n default
              exit 1
            fi

      - name: Health check
        if: success()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          script: |
            echo "🔍 Running health checks..."

            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed (attempt $i)"
                exit 0
              fi
              echo "⏳ Attempt $i: HTTP $STATUS, retrying in 5s..."
              sleep 5
            done

            echo "❌ Health check FAILED after 5 attempts — rolling back"
            kubectl rollout undo deployment/gateway -n default
            exit 1

      - name: Deploy vLLM / Portal / Config
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.component != 'gateway'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          script: |
            cd /root/aither-project
            git pull origin main
            bash scripts/deploy.sh ${{ github.event.inputs.component }}

      - name: Deploy on push (legacy)
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS2_HOST }}
          username: ${{ secrets.VPS2_USER }}
          key: ${{ secrets.VPS2_SSH_KEY }}
          script: |
            cd /root/aither-project
            git pull origin main

            # If gateway files changed, redeploy ConfigMap
            if git diff --name-only HEAD~1 | grep -q "^gateway/"; then
              echo "Gateway files changed — updating ConfigMap..."
              bash scripts/deploy.sh gateway
            fi

            # Apply HPA + other K8s configs
            bash scripts/deploy.sh config

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Deploy #${{ github.run_number }}
            Репо: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}
            Коммит: ${{ github.sha }}
            Автор: ${{ github.actor }}
            Статус: ${{ job.status }}
