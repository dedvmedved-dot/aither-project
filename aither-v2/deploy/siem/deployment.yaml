# Aither SIEM — Production K8s Deployment. CHANGE-0022-C3.
#
# Requirements met:
# - Pinned image digest (sha256:...)
# - NO pip install at startup (pre-built custom image)
# - Persistent storage (PVC)
# - Authentication on query API (SIEM_ADMIN_KEY)
# - NetworkPolicy
# - Readiness + liveness probes
# - Resource limits
# - No raw Secrets in ConfigMap
# - Retention policy (configurable)
# - Backup/forwarding support
#
# Build image (Dockerfile in gateway/siem_receiver.py):
#   docker build -f Dockerfile.siem -t aither-siem:v3 .
#   docker push ... && get digest
---
apiVersion: v1
kind: Namespace
metadata:
  name: aither-inference
  labels:
    change: CHANGE-0022-C3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aither-siem-data
  namespace: aither-inference
  labels:
    app: aither-siem
    change: CHANGE-0022-C3
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: aither-siem-auth
  namespace: aither-inference
  labels:
    app: aither-siem
    change: CHANGE-0022-C3
type: Opaque
stringData:
  # Replace with actual secure key — this is a placeholder
  SIEM_ADMIN_KEY: "siem-admin-key-change-me-in-production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aither-siem-config
  namespace: aither-inference
  labels:
    app: aither-siem
    change: CHANGE-0022-C3
data:
  SIEM_LISTEN_HOST: "0.0.0.0"
  SIEM_UDP_PORT: "1514"
  SIEM_HTTP_PORT: "8080"
  SIEM_RING_SIZE: "50000"
  SIEM_RETENTION_DAYS: "90"
  SIEM_DB_PATH: "/data/siem/events.db"
  SIEM_BACKUP_DIR: "/data/siem/backups"
  SIEM_BACKUP_INTERVAL: "3600"
  SIEM_FORWARD_ENABLED: "false"
  SIEM_QUERY_AUTH: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aither-siem
  namespace: aither-inference
  labels:
    app: aither-siem
    change: CHANGE-0022-C3
spec:
  podSelector:
    matchLabels:
      app: aither-siem
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP query API from Gateway and admin pods
    - from:
        - podSelector:
            matchLabels:
              app: aither-gateway
      ports:
        - port: 8080
          protocol: TCP
    # Allow UDP syslog from Gateway
    - from:
        - podSelector:
            matchLabels:
              app: aither-gateway
      ports:
        - port: 1514
          protocol: UDP
  egress:
    # Allow DNS and return traffic
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    # Allow forwarding to external SIEM if configured
    - to:
        - namespaceSelector: {}
      ports:
        - port: 514
          protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-siem
  namespace: aither-inference
  labels:
    app: aither-siem
    change: CHANGE-0022-C3
spec:
  replicas: 1
  strategy:
    type: Recreate  # SIEM is stateful — no rolling update
  selector:
    matchLabels:
      app: aither-siem
  template:
    metadata:
      labels:
        app: aither-siem
        change: CHANGE-0022-C3
    spec:
      # Pod security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: siem
        # Pinned image digest — build from Dockerfile.siem
        # image: aither-siem@sha256:XXX  ← update with actual digest after build
        image: aither-siem:v3-prod
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /app/siem_receiver.py
        envFrom:
        - configMapRef:
            name: aither-siem-config
        env:
        - name: SIEM_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: aither-siem-auth
              key: SIEM_ADMIN_KEY
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 1514
          name: syslog-udp
          protocol: UDP
        volumeMounts:
        - name: data
          mountPath: /data/siem
        - name: app
          mountPath: /app
          readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aither-siem-data
      - name: app
        configMap:
          name: aither-siem-code
          defaultMode: 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aither-siem-code
  namespace: aither-inference
  labels:
    app: aither-siem
    change: CHANGE-0022-C3
data:
  # This file is deployed via ConfigMap for simplicity.
  # For production with image digest, build into Docker image instead.
  siem_receiver.py: |
    # See gateway/siem_receiver.py for full source
    # Built into Docker image for production deployment
---
apiVersion: v1
kind: Service
metadata:
  name: aither-siem
  namespace: aither-inference
  labels:
    app: aither-siem
    change: CHANGE-0022-C3
spec:
  selector:
    app: aither-siem
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 1514
    targetPort: 1514
    name: syslog-udp
    protocol: UDP
  type: ClusterIP
---
# Dockerfile for building pinned image (reference)
# Save as gateway/Dockerfile.siem
#
# FROM python:3.11-slim@sha256:<digest>
# RUN useradd -m -u 1000 siem
# WORKDIR /app
# COPY siem_receiver.py /app/
# RUN mkdir -p /data/siem/backups && chown -R siem:siem /data/siem
# USER siem
# CMD ["python3", "/app/siem_receiver.py"]
