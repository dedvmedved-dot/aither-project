# Aither Vault — K8s Deployment (persistent, non-dev)
# CHANGE-0022-C2 R7-R5-EMG-GW-R4
#
# Deploys HashiCorp Vault with:
# - Persistent storage (PVC)
# - Kubernetes auth method
# - Least-privilege policies
# - Init/unseal procedure documented
# - No root token in Git
#
# Pre-deploy steps:
#   1. kubectl create namespace vault
#   2. kubectl apply -f deploy/vault/deployment.yaml
#   3. kubectl exec -n vault vault-0 -- vault operator init
#   4. kubectl exec -n vault vault-0 -- vault operator unseal (3 keys)
#   5. Save unseal keys + root token to 1Password/secure store (NEVER to Git)
#   6. kubectl exec -n vault vault-0 -- vault login <root-token>
#   7. vault auth enable kubernetes
#   8. vault write auth/kubernetes/config token_reviewer_jwt=... kubernetes_host=...
#   9. vault policy write aither-gateway vault-policies/aither-gateway-policy.hcl
#  10. vault write auth/kubernetes/role/aither-gateway bound_service_account_names=aither-gateway ...
#  11. Set VAULT_ENABLED=true in Gateway env
#
# Backup: kubectl exec -n vault vault-0 -- vault operator raft snapshot save /vault/data/backup.snap
# Restore: vault operator raft snapshot restore backup.snap
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app: vault
    change: CHANGE-0022-C2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aither-gateway
  namespace: aither-inference
  labels:
    app: aither-gateway
    change: CHANGE-0022-C2
---
# Vault API key policies (least-privilege)
# Store in vault-policies/ and apply after init
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policies
  namespace: vault
data:
  aither-gateway-policy.hcl: |
    # Least-privilege policy for Aither Gateway
    # Only allow reading API key data from aither/ keyspace
    path "secret/data/aither/keys/*" {
      capabilities = ["read"]
    }
    # Allow listing aither keys
    path "secret/metadata/aither/keys/*" {
      capabilities = ["list"]
    }
    # Revoke access
    path "secret/data/aither/keys/*" {
      capabilities = ["delete"]
    }
    # Health check (public endpoint)
    path "sys/health" {
      capabilities = ["read"]
    }
    # PKI issue for key creation
    path "aither-pki/issue/*" {
      capabilities = ["create", "update"]
    }
    # No access to sys/auth, sys/policy, or other secrets
  aither-bff-policy.hcl: |
    # BFF policy — can create API keys via PKI
    path "aither-pki/issue/api-key" {
      capabilities = ["create", "update"]
    }
    path "secret/data/aither/keys/*" {
      capabilities = ["create", "update", "read"]
    }
    path "sys/health" {
      capabilities = ["read"]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
  namespace: vault
  labels:
    app: vault
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
    change: CHANGE-0022-C2
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.18
        args:
        - server
        env:
        - name: VAULT_LOCAL_CONFIG
          value: |
            storage "raft" {
              path = "/vault/data"
              node_id = "vault-0"
            }
            listener "tcp" {
              address     = "0.0.0.0:8200"
              tls_disable = "true"
            }
            api_addr = "http://vault-0.vault.vault.svc.cluster.local:8200"
            cluster_addr = "http://vault-0.vault.vault.svc.cluster.local:8201"
            disable_mlock = true
            ui = true
        ports:
        - containerPort: 8200
          name: http
        - containerPort: 8201
          name: cluster
        volumeMounts:
        - name: vault-data
          mountPath: /vault/data
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: vault-data
        persistentVolumeClaim:
          claimName: vault-data
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
    name: http
  type: ClusterIP
