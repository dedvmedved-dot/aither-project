# Aither BFF Gateway-Canary Deployment
# CHANGE-0022-C5 — R7-R5-EMG-GW-R7 Sections 3-4
#
# Uses production BFF source built as a Docker image — non-root.
# Routes ALL model traffic through Aither Gateway with RS256 delegation JWT.
# TTL ≤ 60s, real org_id/user_id/tier/scopes from session identity.
# /ready: Redis + Gateway /health + delegation key + Gateway model catalog.
# /health: process-only.
#
# Image: 10.129.13.78:5000/aither-bff@sha256:7eabeba5083306920172496235e2f1a7b926295504124f632d9de9e4d419b455
#   Built from aither-v2/tools/bff/ — commit 4523f98, non-root (uid 1000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-bff-gateway-canary
  namespace: aither-inference
  labels:
    app: aither-bff-gateway-canary
    change: CHANGE-0022-C5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aither-bff-gateway-canary
  template:
    metadata:
      labels:
        app: aither-bff-gateway-canary
        change: CHANGE-0022-C5
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: bff-canary
        image: 10.129.13.78:5000/aither-bff@sha256:7eabeba5083306920172496235e2f1a7b926295504124f632d9de9e4d419b455
        imagePullPolicy: Always
        env:
        # ── Gateway routing (CHANGE-0022-C5) ──────────────────────────
        - name: BFF_GATEWAY_URL
          value: "http://aither-gateway.aither-inference.svc.cluster.local:8000"
        - name: BFF_GATEWAY_MODE
          value: "true"
        # ── Redis ────────────────────────────────────────────────────
        - name: REDIS_URL
          value: "redis://aither-redis-rate-limit.aither-inference.svc:6379/0"
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: RATE_LIMIT_MAX_REQUESTS
          value: "10"
        - name: BFF_REQUEST_TIMEOUT_SECONDS
          value: "300"
        # ── Auth secrets ─────────────────────────────────────────────
        - name: ADMIN_USERNAME
          value: "admin"
        - name: ADMIN_PASSWORD_HASH
          value: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
        - name: SESSION_SECRET
          value: "change-0022-c5-canary-session"
        - name: AUTH_TOKEN_HASH_SECRET
          value: "change-0022-c5-canary-auth"
        - name: BFF_14B_UPSTREAM_AUTH_TOKEN
          value: "placeholder-unused-in-gateway-mode"
        - name: BFF_32B_GATEWAY_AUTH_TOKEN
          value: "placeholder-unused-in-gateway-mode"
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: delegation-key
          mountPath: /app/delegation
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: delegation-key
        secret:
          secretName: aither-bff-delegation-key
          defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: aither-bff-gateway-canary
  namespace: aither-inference
  labels:
    app: aither-bff-gateway-canary
    change: CHANGE-0022-C5
spec:
  selector:
    app: aither-bff-gateway-canary
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
