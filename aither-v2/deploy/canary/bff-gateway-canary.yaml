# Aither BFF Gateway-Canary Deployment
# CHANGE-0022-C4 — R7-R5-EMG-GW-R6 Section 2
#
# Uses production BFF source built as a Docker image (NOT inline ConfigMap Python).
# Routes ALL model traffic through Aither Gateway.
# RS256 per-request delegation JWT (TTL <= 60s).
# Real SSE StreamingResponse.
# /ready: Redis + Gateway /health + delegation key + Gateway model catalog.
# /health: process-only (no dependency checks).
# org_id/user_id/tier/scopes from real session identity.
#
# Image: 10.129.13.78:5000/aither-bff:change-0022-c4-canary
#   Built from aither-v2/tools/bff/ with pyjwt[crypto] for RS256 delegation.
#
# kubectl apply -f deploy/canary/bff-gateway-canary.yaml
# kubectl port-forward -n aither-inference svc/aither-bff-gateway-canary 8001:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-bff-gateway-canary
  namespace: aither-inference
  labels:
    app: aither-bff-gateway-canary
    change: CHANGE-0022-C4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aither-bff-gateway-canary
  template:
    metadata:
      labels:
        app: aither-bff-gateway-canary
        change: CHANGE-0022-C4
    spec:
      containers:
      - name: bff-canary
        image: 10.129.13.78:5000/aither-bff:change-0022-c4-canary
        imagePullPolicy: Always
        env:
        # ── Gateway routing ──────────────────────────────────────────
        - name: BFF_GATEWAY_URL
          value: "http://aither-gateway.aither-inference.svc.cluster.local:8000"
        # ── Redis ────────────────────────────────────────────────────
        - name: REDIS_URL
          value: "redis://aither-redis-rate-limit.aither-inference.svc:6379/0"
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: RATE_LIMIT_MAX_REQUESTS
          value: "10"
        - name: BFF_REQUEST_TIMEOUT_SECONDS
          value: "300"
        # ── Delegation JWT ───────────────────────────────────────────
        - name: DELEGATION_PRIVATE_KEY_PATH
          value: "/app/delegation/private.pem"
        - name: DELEGATION_JWT_TTL_SECONDS
          value: "60"
        # ── Auth secrets (from aither-bff-auth Secret) ───────────────
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: ADMIN_USERNAME
        - name: ADMIN_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: ADMIN_PASSWORD_HASH
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: SESSION_SECRET
        - name: AUTH_TOKEN_HASH_SECRET
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: AUTH_TOKEN_HASH_SECRET
        - name: BFF_14B_UPSTREAM_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: BFF_14B_UPSTREAM_AUTH_TOKEN
        - name: BFF_32B_GATEWAY_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: BFF_32B_GATEWAY_AUTH_TOKEN
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: delegation-key
          mountPath: /app/delegation
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: delegation-key
        secret:
          secretName: aither-delegation-key
          defaultMode: 0400
      # NOTE: No ConfigMap volume — all code is in the Docker image.
---
apiVersion: v1
kind: Service
metadata:
  name: aither-bff-gateway-canary
  namespace: aither-inference
  labels:
    app: aither-bff-gateway-canary
    change: CHANGE-0022-C4
spec:
  selector:
    app: aither-bff-gateway-canary
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
