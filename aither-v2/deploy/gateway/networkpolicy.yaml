apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aither-gateway
  namespace: aither-inference
  labels:
    app: aither-gateway
    change: CHANGE-0022
spec:
  podSelector:
    matchLabels:
      app: aither-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: aither-bff
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: vllm
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: aither-redis-rate-limit
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # CHANGE-0022-C5: Vault access
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vault
      podSelector:
        matchLabels:
          app: vault
    ports:
    - protocol: TCP
      port: 8200
