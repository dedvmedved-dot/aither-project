# Aither Gateway — K8s Deployment
# CHANGE-0022-C2: Corrected deployment with proper readiness, env contract, secrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-gateway
  namespace: aither-inference
  labels:
    app: aither-gateway
    change: CHANGE-0022-C2
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aither-gateway
  template:
    metadata:
      labels:
        app: aither-gateway
        change: CHANGE-0022-C2
    spec:
      automountServiceAccountToken: false
      serviceAccountName: aither-gateway
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aither-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: gateway
        image: 10.129.13.78:5000/aither-gateway@sha256:c7f5217d809f4abe1f76bfe1862ee39062e394d002b22549082bfba3d8ba0fda  # CHANGE-0022-C4: S3-S7 scope+rate_limit+idempotent_replay+dlp_holdback+settle_before_DONE
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # vLLM upstream auth
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key
              key: VLLM_API_KEY
        # PostgreSQL — direct PG_URL from Secret
        - name: PG_URL
          valueFrom:
            secretKeyRef:
              name: aither-gateway-postgres
              key: PG_URL
        # Redis
        - name: REDIS_HOST
          value: "aither-redis-rate-limit.aither-inference.svc"
        - name: REDIS_PORT
          value: "6379"
        # JWT delegation public key
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: aither-gateway-delegation-public
              key: public.pem
              optional: true
        # Admin API key
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: aither-gateway-admin
              key: ADMIN_API_KEY
              optional: true
        # Model catalog
        - name: CATALOG_PATH
          value: "/app/catalog.yaml"
        # Feature flags
        - name: BILLING_ENABLED
          value: "true"  # PG is ready
        - name: SECURITY_ENABLED
          value: "true"
        - name: SECURITY_EGRESS_ENABLED
          value: "true"
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: AUTH_ENABLED
          value: "true"
        - name: USAGE_ENABLED
          value: "true"
        - name: METRICS_ENABLED
          value: "true"
        - name: VAULT_ENABLED
          value: "true"
        - name: VAULT_REQUIRED
          value: "true"
        # Vault K8s auth (CHANGE-0022-C5) — no static token, projected SA
        - name: VAULT_ADDR
          value: "https://vault.vault.svc:8200"
        - name: VAULT_ROLE
          value: "aither-gateway"
        - name: VAULT_AUTH_PATH
          value: "kubernetes"
        - name: VAULT_CA_CERT
          value: "/vault/ca/ca.crt"
        - name: VAULT_SA_TOKEN_PATH
          value: "/var/run/secrets/vault/token"
        - name: SIEM_ENABLED
          value: "true"
        - name: SIEM_HOST
          value: "aither-siem.aither-inference.svc"
        - name: SIEM_PORT
          value: "1514"
        - name: RAG_ENABLED
          value: "true"
        # Rate limits (defaults for free tier)
        - name: RATE_LIMIT_RPM
          value: "300"
        - name: RATE_LIMIT_TPM
          value: "100000"
        # Timeouts
        - name: UPSTREAM_TIMEOUT
          value: "300"
        - name: UPSTREAM_CONNECT_TIMEOUT
          value: "10"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app/catalog.yaml
          name: catalog
          subPath: catalog.yaml
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/log/aither
          name: varlog
        - mountPath: /var/run/secrets/vault
          name: vault-sa-token
          readOnly: true
        - mountPath: /vault/ca
          name: vault-ca
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: catalog
        configMap:
          name: aither-gateway-catalog
      - name: tmp
        emptyDir: {}
      - name: varlog
        emptyDir: {}
      # CHANGE-0022-C5: Projected SA token for Vault K8s auth
      - name: vault-sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: vault
      # CHANGE-0022-C5: Vault CA cert for TLS verification
      - name: vault-ca
        configMap:
          name: vault-ca-cert
          defaultMode: 0444
