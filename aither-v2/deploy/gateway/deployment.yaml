# Aither Gateway — K8s Deployment
# CHANGE-0022: Full Gateway restoration as FastAPI/ASGI application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-gateway
  namespace: aither-inference
  labels:
    app: aither-gateway
    change: CHANGE-0022
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aither-gateway
  template:
    metadata:
      labels:
        app: aither-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aither-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: gateway
        image: aither-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # vLLM upstream auth
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key
              key: VLLM_API_KEY
        # PostgreSQL
        - name: PG_HOST
          value: "aither-postgres"  # adjust to actual PG service
        - name: PG_PORT
          value: "5432"
        - name: PG_USER
          value: "aither"
        - name: PG_DB
          value: "aither"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: AUTH_TOKEN_HASH_SECRET
              optional: true
        # Redis
        - name: REDIS_URL
          value: "aither-redis-rate-limit.aither-inference.svc"
        - name: REDIS_PORT
          value: "6379"
        # Rate limits (defaults for free tier)
        - name: RATE_LIMIT_RPM
          value: "300"
        - name: RATE_LIMIT_TPM
          value: "100000"
        # JWT delegation
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: AUTH_TOKEN_HASH_SECRET
              optional: true
        # Admin
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: aither-bff-auth
              key: ADMIN_PASSWORD_HASH
              optional: true
        # Model catalog
        - name: CATALOG_PATH
          value: "/app/catalog.yaml"
        # Vault (optional — dev mode by default)
        - name: VAULT_ENABLED
          value: "false"
        - name: VAULT_REQUIRED
          value: "false"
        # SIEM (optional)
        - name: SIEM_ENABLED
          value: "false"
        # Timeouts
        - name: UPSTREAM_TIMEOUT_SECONDS
          value: "300"
        - name: UPSTREAM_CONNECT_TIMEOUT
          value: "10"
        - name: BILLING_ENABLED
          value: "true"
        - name: SECURITY_ENABLED
          value: "true"
        - name: RAG_ENABLED
          value: "true"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app/catalog.yaml
          name: catalog
          subPath: catalog.yaml
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/log/aither
          name: varlog
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: catalog
        configMap:
          name: aither-gateway-catalog
      - name: tmp
        emptyDir: {}
      - name: varlog
        emptyDir: {}
