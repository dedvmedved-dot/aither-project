events {
    worker_connections 1024;
}
http {
    resolver 10.96.0.10 valid=30s;
    limit_req_zone $binary_remote_addr zone=gateway_api:10m rate=300r/m;
    server {
        listen 8000;
        server_name _;
        client_max_body_size 4m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location = /ready {
            access_log off;
            proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000/health;
            proxy_read_timeout 5s;
        }

        location = /version {
            access_log off;
            return 200 '{"service":"nginx-gateway-32b","version":"1.0.0"}';
            add_header Content-Type application/json;
        }

        location = /v1/chat/completions {
            return 422 '{"error":"qwen-32b-base does not support chat"}';
        }
        
        location /v1/completions {
            limit_req zone=gateway_api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_intercept_errors on;
            error_page 401 403 = @auth_denied;
            error_page 429 = @rate_limited;
        }
        
        location @auth_denied { 
            return 401 '{"error":"auth required"}';
            add_header Content-Type application/json;
        }
        
        location @rate_limited {
            return 429 '{"error":"rate limit exceeded","retry_after":"30s"}';
            add_header Content-Type application/json;
            add_header Retry-After "30" always;
        }
        
        location /health { proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000/health; }
        location /v1/models { proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000/v1/models; }
        location / { return 404 '{"error":"not found"}'; }
    }
}
