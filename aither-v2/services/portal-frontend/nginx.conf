server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Auth check — proxy directly to identity (bypasses BFF which uses Redis sessions)
    location = /api/v1/auth/me {
        proxy_pass http://aither-identity.aither-inference.svc:8000/v1/identity/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # External OpenAI-compatible API (aither_ bearer key) — Portal Backend
    location = /api/v1/models {
        proxy_pass http://aither-portal-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location = /api/v1/chat/completions {
        proxy_pass http://aither-portal-backend:8000/v1/chat/completions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://aither-bff:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;
    }

    # Identity Service OAuth proxy (new paths)
    location /v1/identity/ {
        proxy_pass http://aither-identity.aither-inference.svc:8000/v1/identity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;
    }

    # Identity Service OAuth callback (old registered paths)
    location /auth/ {
        proxy_pass http://aither-identity.aither-inference.svc:8000/v1/identity/auth/oauth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        types { }
        default_type text/plain;
    }

    location = /docs {
        return 301 /docs/00_INDEX.md;
    }

    location /health {
        proxy_pass http://aither-bff:8000/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://aither-bff:8000/health;
        proxy_set_header Host $host;
    }
}
