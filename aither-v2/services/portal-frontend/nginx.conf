server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to portal-backend
    location /api/ {
        proxy_pass http://aither-portal-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct health/version endpoints (proxy to portal-backend)
    location /health {
        proxy_pass http://aither-portal-backend:8000;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://aither-portal-backend:8000;
        proxy_set_header Host $host;
    }

    location /version {
        proxy_pass http://aither-portal-backend:8000;
        proxy_set_header Host $host;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
