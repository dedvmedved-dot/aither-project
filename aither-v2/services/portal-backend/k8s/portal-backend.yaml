# Aither Portal Backend (BFF) — Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-portal-backend
  namespace: aither-inference
  labels:
    app: aither-portal-backend
    stage: "15"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aither-portal-backend
  template:
    metadata:
      labels:
        app: aither-portal-backend
        stage: "15"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: portal-backend
          image: 10.129.13.78:5000/aither-portal-backend@sha256:b5a0c352243341abe9a602e666594525ff5f4dbd94d5a01a1f65b2243e58aa94
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IDENTITY_INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: aither-identity-secret
                  key: IDENTITY_INTERNAL_API_SECRET
            - name: PORTAL_IDENTITY_URL
              value: "http://aither-identity:8000"
            - name: PORTAL_AI_PLATFORM_URL
              value: "http://aither-ai-platform:8000"
            - name: PORTAL_LOG_LEVEL
              value: "INFO"
            - name: PORTAL_CORS_ORIGIN
              value: "http://localhost:3000"
            - name: UPSTREAM_QWEN3_32B_URL
              value: "http://vllm-qwen3-32b-awq.aither-inference.svc:8000"
            - name: UPSTREAM_QWEN38_27B_URL
              value: "http://vllm-qwen38-27b-fp8.aither-inference.svc:8000"
            - name: UPSTREAM_QWEN3_32B_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
            - name: UPSTREAM_QWEN38_27B_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aither-portal-backend
  namespace: aither-inference
  labels:
    app: aither-portal-backend
    stage: "15"
spec:
  type: ClusterIP
  selector:
    app: aither-portal-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
