# Aither Identity Service — Secret Example
#
# DO NOT COMMIT REAL SECRET VALUES
# DO NOT APPLY WITHOUT REPLACING PLACEHOLDERS
#
# Usage:
#   1. Copy this file to identity-secret.yaml
#   2. Replace all REPLACE_ME values with actual secrets
#   3. kubectl apply -f services/identity/k8s/identity-secret.yaml
#
# WARNING: Applying this file with placeholder values will
# create a Secret with weak/default credentials.
#
apiVersion: v1
kind: Secret
metadata:
  name: aither-identity-secret
  namespace: aither-inference
  labels:
    app: aither-identity
    stage: "15"
type: Opaque
stringData:
  IDENTITY_SECRET_KEY: "REPLACE_ME"        # Required: JWT signing key (min 32 chars)
  IDENTITY_ADMIN_USER: "admin"             # Bootstrap admin username
  IDENTITY_ADMIN_PASS: "REPLACE_ME"        # Required: bcrypt hash of admin password
