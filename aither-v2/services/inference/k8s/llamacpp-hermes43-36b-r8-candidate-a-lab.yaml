# Aither R8 Candidate A — Hermes-4.3-36B Q4_K_M GGUF + llama.cpp isolated LAB (n7, temporary).
# NOT production. Served model hermes-4.3-36b-r8-lab — never exposed via agent aliases.
# n7 maintenance window: Qwen3.8 scaled 1->0; restore required after Candidate A.
# Immutable image reference (pinned digest), NOT floating tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llamacpp
    model: hermes43-36b-r8-lab
  name: llamacpp-hermes43-36b-r8-lab
  namespace: aither-inference
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: llamacpp
      model: hermes43-36b-r8-lab
  template:
    metadata:
      labels:
        app: llamacpp
        model: hermes43-36b-r8-lab
    spec:
      nodeName: bootsmam-k8s-clnt01-n7-gpu
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      containers:
      - name: llamacpp
        image: ghcr.io/ggml-org/llama.cpp@sha256:150b59966fb5b2cb1a8fa9d226267c56ebd22c520c7b3640331cde87f3c4fb01
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - /model/hermes-4_3_36b-Q4_K_M.gguf
        - --ctx-size
        - "65536"
        - --n-gpu-layers
        - "999"
        - --split-mode
        - layer
        - --tensor-split
        - "1,1"
        - --cache-type-k
        - q8_0
        - --cache-type-v
        - q8_0
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --alias
        - hermes-4.3-36b-r8-lab
        - --parallel
        - "1"
        - --jinja
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: "48Gi"
            nvidia.com/gpu: "2"
          limits:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model
          mountPath: /model
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 240
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: model
        hostPath:
          path: /data/models/Hermes-4.3-36B-GGUF
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp-hermes43-36b-r8-lab
  namespace: aither-inference
spec:
  selector:
    app: llamacpp
    model: hermes43-36b-r8-lab
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
