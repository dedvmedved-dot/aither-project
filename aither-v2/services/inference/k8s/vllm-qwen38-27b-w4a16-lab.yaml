# Aither Qwen3.8-27B W4A16 lab qualification deployment (n8, isolated).
# NOT production. Served model qwen3.8-27b-w4a16-lab — never exposed via agent-deep.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vllm
    model: qwen38-27b-w4a16-lab
  name: vllm-qwen38-27b-w4a16-lab
  namespace: aither-inference
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: vllm
      model: qwen38-27b-w4a16-lab
  template:
    metadata:
      labels:
        app: vllm
        model: qwen38-27b-w4a16-lab
    spec:
      nodeName: bootsman-k8s-clnt01-n8-gpu
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      serviceAccountName: vllm-sa
      terminationGracePeriodSeconds: 120
      containers:
      - name: vllm
        image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model
        - /model
        - --served-model-name
        - qwen3.8-27b-w4a16-lab
        - --tensor-parallel-size
        - "2"
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --gpu-memory-utilization
        - "0.90"
        - --max-model-len
        - "65536"
        - --max-num-seqs
        - "1"
        - --dtype
        - half
        - --enforce-eager
        - --reasoning-parser
        - qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_xml
        - --generation-config
        - vllm
        env:
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              key: VLLM_API_KEY
              name: vllm-api-key
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: "1"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "8"
            memory: "48Gi"
            nvidia.com/gpu: "2"
          limits:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: "2"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model
          mountPath: /model
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: model
        hostPath:
          path: /data/models/Qwen3.8-27B-W4A16-LAB
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen38-27b-w4a16-lab
  namespace: aither-inference
spec:
  selector:
    app: vllm
    model: qwen38-27b-w4a16-lab
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
