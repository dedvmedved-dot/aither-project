# Authoritative manifest for active Qwen3.8-27B vLLM deployment (vllm-qwen38-27b-fp8).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vllm
    model: qwen38-27b-fp8
  name: vllm-qwen38-27b-fp8
  namespace: aither-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      model: qwen38-27b-fp8
  template:
    metadata:
      labels:
        app: vllm
        model: qwen38-27b-fp8
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --model
        - /model
        - --served-model-name
        - qwen3.8-27b
        - --tensor-parallel-size
        - '2'
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --gpu-memory-utilization
        - '0.90'
        - --max-model-len
        - '65536'
        - --max-num-seqs
        - '1'
        - --dtype
        - half
        - --enforce-eager
        - --reasoning-parser
        - qwen3
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        env:
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              key: VLLM_API_KEY
              name: vllm-api-key
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: '1'
        image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: vllm
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '8'
            memory: 64Gi
            nvidia.com/gpu: '2'
          requests:
            cpu: '8'
            memory: 48Gi
            nvidia.com/gpu: '2'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 120
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /model
          name: model
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        aither.io/inference-primary: 'true'
      restartPolicy: Always
      runtimeClassName: nvidia
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: vllm-sa
      serviceAccountName: vllm-sa
      terminationGracePeriodSeconds: 120
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 8Gi
        name: dshm
      - hostPath:
          path: /data/models/Qwen3.8-27B-FP8
          type: ''
        name: model

