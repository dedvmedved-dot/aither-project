# aither-bff Deployment after Stage 05 corrective
# Retrieved: 2026-07-20 02:30 MSK
# Source: kubectl -n aither-inference get deployment aither-bff -o yaml
# (machine-readable YAML, truncated to relevant fields)

apiVersion: apps/v1
kind: Deployment
metadata:
  labels: { app: aither-bff }
  name: aither-bff
  namespace: aither-inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: aither-bff }
  template:
    metadata:
      labels: { app: aither-bff }
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          export HOME=/tmp && pip install -q --user fastapi uvicorn httpx pydantic 2>&1 && exec python /app/app.py 2>&1
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 30
          periodSeconds: 30
        name: bff
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits: { cpu: 500m, memory: 512Mi }
          requests: { cpu: 200m, memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet: { path: /health, port: http }
          initialDelaySeconds: 30
          periodSeconds: 5
        volumeMounts:
        - mountPath: /app
          name: app
          readOnly: true
      volumes:
      - configMap:
          name: aither-bff-config
        name: app
