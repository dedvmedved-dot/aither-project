---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aither-fluentbit-config
  namespace: aither
  labels:
    app.kubernetes.io/part-of: aither
    app.kubernetes.io/component: observability
    stage: stage17
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name         tail
        Path         /var/log/containers/*.log
        Tag          kube.*
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On

    [FILTER]
        Name         kubernetes
        Match        kube.*
        Merge_Log    On
        Keep_Log     Off

    [OUTPUT]
        Name         es
        Match        *
        Host         ${ES_HOST}
        Port         ${ES_PORT}
        Index        aither-logs-${DATE}
        Type         _doc
