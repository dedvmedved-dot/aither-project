apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aither-stage17-services
  namespace: aither
  labels:
    app.kubernetes.io/part-of: aither
    app.kubernetes.io/component: observability
    stage: stage17
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aither
  namespaceSelector:
    matchNames:
      - aither
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aither-gateway-legacy
  namespace: aither-inference
  labels:
    app.kubernetes.io/part-of: aither
    app.kubernetes.io/component: observability
    stage: stage17
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - nginx-gateway
          - aither-bff
          - aither-portal
  namespaceSelector:
    matchNames:
      - aither-inference
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aither-alerts
  namespace: aither
  labels:
    app.kubernetes.io/part-of: aither
    app.kubernetes.io/component: observability
    stage: stage17
spec:
  groups: []
  # Alert rules are deployed from docs/stage17/prometheus/alert-rules.yaml
