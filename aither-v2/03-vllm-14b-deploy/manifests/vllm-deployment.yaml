apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-14b-instruct
  namespace: aither-inference
  labels:
    app: vllm
    model: qwen-14b-instruct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      model: qwen-14b-instruct
  template:
    metadata:
      labels:
        app: vllm
        model: qwen-14b-instruct
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      serviceAccountName: vllm-sa
      runtimeClassName: nvidia
      nodeSelector:
        aither.io/qwen14b-instruct: "true"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.5
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - /models/Qwen2.5-14B-Instruct
            - --tensor-parallel-size
            - "1"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "4096"
            - --dtype
            - half
            - --max-num-seqs
            - "4"
            - --enforce-eager
            - --cpu-offload-gb
            - "4"
            - --swap-space
            - "8"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 36Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: 36Gi
              cpu: "8"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"
        - name: models
          hostPath:
            path: /data/models
            type: Directory
---
