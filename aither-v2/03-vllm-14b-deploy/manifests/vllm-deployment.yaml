apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-14b-instruct
  namespace: aither-inference
  labels:
    app: vllm
    model: qwen-14b-instruct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      model: qwen-14b-instruct
  template:
    metadata:
      labels:
        app: vllm
        model: qwen-14b-instruct
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: vllm-sa
      runtimeClassName: nvidia
      nodeName: bootsmam-k8s-clnt01-n7-gpu
      hostPID: true
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.5
          command:
            - sh
            - -c
            - |
              echo "=== Kill stale GPU processes ==="
              nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader | grep VLLM | cut -d, -f1 | while read pid; do
                echo "Killing PID $pid..."
                kill -9 "$pid" 2>/dev/null || true
              done
              sleep 3
              echo "=== GPU after cleanup ==="
              nvidia-smi --query-gpu=index,memory.used --format=csv,noheader
              echo "=== Start vLLM ==="
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model /models/Qwen2.5-14B-Instruct \
                --tensor-parallel-size 1 \
                --host 0.0.0.0 --port 8000 \
                --gpu-memory-utilization 0.90 \
                --max-model-len 4096 \
                --trust-remote-code \
                --dtype half \
                --enforce-eager \
                --cpu-offload-gb 4 \
                --swap-space 8 \
                --max-num-seqs 4
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 36Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: 28Gi
              cpu: "4"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"
        - name: models
          hostPath:
            path: /data/models
            type: Directory
---
