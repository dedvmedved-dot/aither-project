apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-14b-instruct
  namespace: aither-inference
  labels:
    app: vllm
    model: qwen-14b-instruct
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm
      model: qwen-14b-instruct
  template:
    metadata:
      labels:
        app: vllm
        model: qwen-14b-instruct
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      serviceAccountName: vllm-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      runtimeClassName: nvidia
      nodeSelector:
        aither.io/vllm14b-primary: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vllm
                topologyKey: kubernetes.io/hostname
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:6cf9808ca8810fc6c3fd0451c2e7784fb224590d81f7db338e7eaf3c02a33d33
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - /model
            - --tensor-parallel-size
            - "2"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "4096"
            - --dtype
            - half
            - --max-num-seqs
            - "1"
            - --enforce-eager
            - --generation-config
            - vllm
            - --served-model-name
            - qwen-14b
            - --disable-log-requests
            - --disable-fastapi-docs
          env:
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "2"
              memory: 64Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "2"
              memory: 64Gi
              cpu: "8"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: model
              mountPath: /model
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
        - name: model
          hostPath:
            path: /data/models/Qwen2.5-14B-Instruct
            type: Directory
---
