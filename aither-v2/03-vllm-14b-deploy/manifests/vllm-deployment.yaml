apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-14b
  namespace: aither-inference
  labels:
    app: vllm
    model: qwen-14b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm
      model: qwen-14b
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: vllm
        model: qwen-14b
    spec:
      serviceAccountName: vllm-sa
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-Quadro-RTX-6000"
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "/models/Qwen/Qwen2.5-14B-Instruct"
            - "--tensor-parallel-size"
            - "1"
            - "--pipeline-parallel-size"
            - "1"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--max-model-len"
            - "16384"
            - "--trust-remote-code"
            - "--enforce-eager"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 32Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: 24Gi
              cpu: "4"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"
        - name: models
          persistentVolumeClaim:
            claimName: model-storage
---
