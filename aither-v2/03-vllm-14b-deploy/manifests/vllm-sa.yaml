apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-sa
  namespace: aither-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-role
  namespace: aither-inference
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-rolebinding
  namespace: aither-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vllm-role
subjects:
  - kind: ServiceAccount
    name: vllm-sa
