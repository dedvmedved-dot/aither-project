apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-inference
  namespace: aither-inference
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        aither.io/benchmark-node: "true"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: benchmark
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              VLLM_KEY="$VLLM_API_KEY"
              GATEWAY="nginx-gateway-32b.aither-inference.svc:8000"
              REPORT="/tmp/benchmark-report.txt"

              # Helper: print + write
              log() { echo "$1" | tee -a "$REPORT"; }

              log "=========================================="
              log "= Inference Benchmark v2"
              log "= Date: $(date -Iseconds)"
              log "= Duration: full run (~20 min)"
              log "=========================================="

              # ---- AUTH NEGATIVE TESTS ----
              log ""
              log "--- AUTH TESTS ---"
              for DESC in "no token" "wrong token"; do
                case "$DESC" in
                  "no token")    H="";;
                  "wrong token") H="-H Authorization: Bearer invalid_key_here";;
                esac
                CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 \
                  $H \
                  "http://${GATEWAY}/v1/completions")
                log "  Auth test '$DESC': HTTP $CODE (expect 401/403)"
              done

              CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 \
                -H "Authorization: Bearer $VLLM_KEY" \
                "http://${GATEWAY}/v1/completions")
              log "  Auth test 'valid token': HTTP $CODE (expect 200)"

              # ---- 32B GATEWAY TESTS ----
              log ""
              log "--- 32B GATEWAY TESTS ---"

              # Chat block test
              log "  32B chat via gateway (expect 422):"
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
                -H "Authorization: Bearer $VLLM_KEY" \
                -H "Content-Type: application/json" \
                -d '{"model":"qwen-32b-base","messages":[{"role":"user","content":"hi"}]}' \
                "http://${GATEWAY}/v1/chat/completions")
              log "    HTTP $CODE (expect 422)"

              # Completion via gateway
              log "  32B completion via gateway (expect 200):"
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 \
                -H "Authorization: Bearer $VLLM_KEY" \
                -H "Content-Type: application/json" \
                -d '{"model":"qwen-32b-base","prompt":"The capital of France is","temperature":0,"max_tokens":24}' \
                "http://${GATEWAY}/v1/completions")
              log "    HTTP $CODE (expect 200)"

              # ---- 14B BENCHMARK ----
              log ""
              log "--- 14B BENCHMARK ---"
              MODEL_SVC="vllm-14b-instruct.aither-inference.svc:8000"
              DATA14='{"model":"qwen-14b","messages":[{"role":"user","content":"What is capital of France?"}],"temperature":0,"max_tokens":128}'

              # Health
              log "1. Health:"
              time curl -sS -o /dev/null -w "  200 in %{time_total}s\n" \
                --max-time 10 "http://${MODEL_SVC}/health" 2>&1 | tee -a "$REPORT"

              # Single Chat (TTFB)
              log "2. Single Chat (TTFB):"
              T=$(curl -sS -w "HTTP=%{http_code} TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\n" \
                --max-time 300 \
                -H "Authorization: Bearer $VLLM_KEY" \
                -H "Content-Type: application/json" \
                -d "$DATA14" \
                -o /tmp/resp14.txt \
                "http://${MODEL_SVC}/v1/chat/completions")
              log "   $T"
              log "   Response: $(head -c 200 /tmp/resp14.txt)"

              # Concurrency 1,2,4
              for CONC in 1 2 4; do
                log "3. Concurrency $CONC:"
                PIDS=""; TFILE=$(mktemp)
                for j in $(seq 1 $CONC); do
                  (curl -sS -w "req_$j: HTTP=%{http_code} TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\n" \
                    --max-time 300 \
                    -H "Authorization: Bearer $VLLM_KEY" \
                    -H "Content-Type: application/json" \
                    -d "$DATA14" \
                    -o /dev/null \
                    "http://${MODEL_SVC}/v1/chat/completions" >> "$TFILE") &
                  PIDS="$PIDS $!"
                done
                wait $PIDS
                while read -r line; do log "   $line"; done < "$TFILE"
                rm "$TFILE"
              done

              # ---- 32B BENCHMARK ----
              log ""
              log "--- 32B BENCHMARK ---"
              MODEL32="vllm-32b-gptq.aither-inference.svc:8000"
              DATA32='{"model":"qwen-32b-base","prompt":"The capital of France is","temperature":0,"max_tokens":128}'

              # Health
              log "1. Health:"
              time curl -sS -o /dev/null -w "  200 in %{time_total}s\n" \
                --max-time 10 "http://${MODEL32}/health" 2>&1 | tee -a "$REPORT"

              # Single Completion
              log "2. Single Completion:"
              T=$(curl -sS -w "HTTP=%{http_code} TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\n" \
                --max-time 300 \
                -H "Authorization: Bearer $VLLM_KEY" \
                -H "Content-Type: application/json" \
                -d "$DATA32" \
                -o /tmp/resp32.txt \
                "http://${MODEL32}/v1/completions")
              log "   $T"
              log "   Response: $(head -c 200 /tmp/resp32.txt)"

              # Concurrency 1,2,4
              for CONC in 1 2 4; do
                log "3. Concurrency $CONC:"
                PIDS=""; TFILE=$(mktemp)
                for j in $(seq 1 $CONC); do
                  (curl -sS -w "req_$j: HTTP=%{http_code} TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\n" \
                    --max-time 300 \
                    -H "Authorization: Bearer $VLLM_KEY" \
                    -H "Content-Type: application/json" \
                    -d "$DATA32" \
                    -o /dev/null \
                    "http://${MODEL32}/v1/completions" >> "$TFILE") &
                  PIDS="$PIDS $!"
                done
                wait $PIDS
                while read -r line; do log "   $line"; done < "$TFILE"
                rm "$TFILE"
              done

              log ""
              log "=========================================="
              log "= BENCHMARK COMPLETE: $(date -Iseconds)"
              log "=========================================="

              # Print final report
              cat "$REPORT"
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          resources:
            limits:
              cpu: "2"
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 256Mi
