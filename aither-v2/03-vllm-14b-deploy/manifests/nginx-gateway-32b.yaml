apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-32b
  namespace: aither-inference
data:
  default.conf: |
    server {
        listen 8000;
        server_name _;

        # Auth — delegate to vLLM (VLLM_API_KEY)
        auth_request /auth;
        auth_request_set $auth_status $upstream_status;

        location = /auth {
            internal;
            proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000/health;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Block Chat completions for this model
        location = /v1/chat/completions {
            return 422 '{"error":{"message":"qwen-32b-base does not support chat. Use /v1/completions.","type":"invalid_request_error"}}';
        }

        location /v1/completions {
            proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000/health;
        }

        location /v1/models {
            proxy_pass http://vllm-32b-gptq.aither-inference.svc:8000/v1/models;
        }

        location / {
            return 404 '{"error":"endpoint not found"}';
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway-32b
  namespace: aither-inference
  labels:
    app: nginx-gateway
    model: qwen-32b-gptq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
      model: qwen-32b-gptq
  template:
    metadata:
      labels:
        app: nginx-gateway
        model: qwen-32b-gptq
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: nginx-gateway-32b
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-32b
  namespace: aither-inference
  labels:
    app: nginx-gateway
    model: qwen-32b-gptq
spec:
  selector:
    app: nginx-gateway
    model: qwen-32b-gptq
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
