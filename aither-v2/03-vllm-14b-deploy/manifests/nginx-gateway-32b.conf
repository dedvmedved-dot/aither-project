server {
    listen 8080;
    server_name _;

    # API key verification
    set $api_key "";
    if ($http_authorization ~* "Bearer (.+)$") {
        set $api_key $1;
    }

    location = /v1/chat/completions {
        return 422 '{"error":{"message":"qwen-32b-base is completion-only model. Use /v1/completions instead.","type":"invalid_request_error","code":"model_not_supported"}}';
    }

    location /v1/completions {
        proxy_pass http://10.244.1.2:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://10.244.1.2:8000/health;
    }

    location /v1/models {
        proxy_pass http://10.244.1.2:8000/v1/models;
    }

    location / {
        return 404 '{"error":"endpoint not available for qwen-32b-base"}';
    }
}
