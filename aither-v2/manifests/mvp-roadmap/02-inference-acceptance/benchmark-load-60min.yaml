apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-load-60min
  namespace: aither-inference
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        aither.io/benchmark-node: "true"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: endurance
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              KEY="$VLLM_API_KEY"
              SVC14="vllm-14b-instruct.aither-inference.svc:8000"
              SVC32="vllm-32b-gptq.aither-inference.svc:8000"
              GW="nginx-gateway-32b.aither-inference.svc:8000"
              DATA14='{"model":"qwen-14b","messages":[{"role":"user","content":"What is capital of France?"}],"temperature":0,"max_tokens":64}'
              DATA32='{"model":"qwen-32b-base","prompt":"The capital of France is","temperature":0,"max_tokens":64}'
              REPORT="/tmp/endurance-report.txt"
              log() { echo "$1" | tee -a "$REPORT"; }

              log "=== 60-min Endurance Test ==="
              log "Start: $(date -Iseconds)"
              log "Target: 3600s"

              DURATION=3600
              END=$(( $(date +%s) + DURATION ))
              START_TS=$(date +%s)
              REQ14=0; OK14=0; FAIL14=0
              REQ32=0; OK32=0; FAIL32=0
              REQGW=0; OKGW=0; FAILGW=0

              while [ $(date +%s) -lt $END ]; do
                # 14B request
                CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 300 \
                  -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                  -d "$DATA14" "http://${SVC14}/v1/chat/completions" 2>/dev/null)
                REQ14=$((REQ14+1))
                [ "$CODE" = "200" ] && OK14=$((OK14+1)) || FAIL14=$((FAIL14+1))

                # 32B request
                CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 300 \
                  -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                  -d "$DATA32" "http://${SVC32}/v1/completions" 2>/dev/null)
                REQ32=$((REQ32+1))
                [ "$CODE" = "200" ] && OK32=$((OK32+1)) || FAIL32=$((FAIL32+1))

                # Gateway request (every 5th request)
                if [ $((REQ32 % 5)) -eq 0 ]; then
                  CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 300 \
                    -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                    -d "$DATA32" "http://${GW}/v1/completions" 2>/dev/null)
                  REQGW=$((REQGW+1))
                  [ "$CODE" = "200" ] && OKGW=$((OKGW+1)) || FAILGW=$((FAILGW+1))
                fi

                # Progress every 60s
                ELAPSED=$(( $(date +%s) - START_TS ))
                if [ $((ELAPSED % 60)) -eq 0 ] 2>/dev/null && [ $ELAPSED -gt 0 ]; then
                  log "  $(date -Iseconds): elapsed=${ELAPSED}s 14B=${OK14}/${REQ14} 32B=${OK32}/${REQ32} GW=${OKGW}/${REQGW}"
                fi
              done

              ELAPSED=$(( $(date +%s) - START_TS ))
              log ""
              log "=========================================="
              log "= RESULTS"
              log "  Duration: ${ELAPSED}s (target 3600s)"
              log ""
              log "--- 14B Chat ---"
              log "  Requests: $REQ14"
              log "  OK: $OK14 ($([ $REQ14 -gt 0 ] && echo \"$((OK14*100/REQ14))%\")"
              log "  FAIL: $FAIL14"
              log ""
              log "--- 32B Completion ---"
              log "  Requests: $REQ32"
              log "  OK: $OK32 ($([ $REQ32 -gt 0 ] && echo \"$((OK32*100/REQ32))%\")"
              log "  FAIL: $FAIL32"
              log ""
              log "--- Gateway Completion ---"
              log "  Requests: $REQGW"
              log "  OK: $OKGW ($([ $REQGW -gt 0 ] && echo \"$((OKGW*100/REQGW))%\")"
              log "  FAIL: $FAILGW"
              log ""
              if [ $FAIL14 -eq 0 ] && [ $FAIL32 -eq 0 ]; then
                log "  Conclusion: PASSED"
              elif [ $FAIL14 -eq 0 ] || [ $FAIL32 -eq 0 ]; then
                log "  Conclusion: PARTIAL"
              else
                log "  Conclusion: NEEDS REVIEW"
              fi
              log "=========================================="
              cat "$REPORT"
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          resources:
            limits: { cpu: "2", memory: 512Mi }
            requests: { cpu: 500m, memory: 256Mi }
