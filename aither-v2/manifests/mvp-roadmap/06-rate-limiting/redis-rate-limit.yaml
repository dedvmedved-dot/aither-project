# Redis Rate Limit Deployment for Aither BFF
# Stage 06 — MVP-level rate limiting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-redis-rate-limit
  namespace: aither-inference
  labels:
    app: aither-redis-rate-limit
    stage: "06"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aither-redis-rate-limit
  template:
    metadata:
      labels:
        app: aither-redis-rate-limit
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext: {}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aither-redis-rate-limit
  namespace: aither-inference
  labels:
    app: aither-redis-rate-limit
spec:
  selector:
    app: aither-redis-rate-limit
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
