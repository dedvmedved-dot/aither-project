apiVersion: v1
kind: Pod
metadata:
  name: gpu-runtime-test
  namespace: aither-inference
  labels:
    app: gpu-runtime-test
    aither.io/purpose: gpu-runtime-validation
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command:
        - nvidia-smi
      resources:
        limits:
          nvidia.com/gpu: 1
