apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-32b
  namespace: aither-inference
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        resolver 10.96.0.10 valid=30s;
        server {
            listen 8000;
            server_name _;
            client_max_body_size 4m;

            # Local health endpoint — checks nginx process only, not upstream
            location = /healthz {
                access_log off;
                return 200 'ok';
                add_header Content-Type text/plain;
            }

            location = /v1/chat/completions {
                return 422 '{"error":"qwen-32b-base does not support chat"}';
            }
            location /v1/completions {
                proxy_pass http://10.99.3.103:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Authorization $http_authorization;
                proxy_read_timeout 300s;
                proxy_connect_timeout 10s;
                proxy_send_timeout 30s;
                proxy_intercept_errors on;
                error_page 401 403 = @auth_denied;
            }
            location @auth_denied { return 401 '{"error":"auth required"}'; }
            location /health { proxy_pass http://10.99.3.103:8000/health; }
            location /v1/models { proxy_pass http://10.99.3.103:8000/v1/models; }
            location / { return 404 '{"error":"not found"}'; }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway-32b
  namespace: aither-inference
  labels: { app: nginx-gateway, model: qwen-32b-gptq }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nginx-gateway, model: qwen-32b-gptq }
  template:
    metadata:
      labels: { app: nginx-gateway, model: qwen-32b-gptq }
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: nginx
          image: nginx:alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN","SETGID","SETUID"] }
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          # startupProbe: allows nginx up to 150s to start (30 × 5s)
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          # readinessProbe: reflects readiness to accept traffic
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # livenessProbe: checks local nginx process (not upstream)
          # Purpose: restart nginx if the local process is dead
          # Does NOT depend on vLLM — /healthz is a local nginx return
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: nginx-gateway-32b
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-32b
  namespace: aither-inference
  labels: { app: nginx-gateway, model: qwen-32b-gptq }
spec:
  selector: { app: nginx-gateway, model: qwen-32b-gptq }
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
