apiVersion: v1
data:
  app.js: "/* Aither Portal — MVP Application Logic */\n(function() {\n    'use strict';\n\
    \n    const API = '/api/v1';\n\n    // State\n    let state = {\n        sessionId:\
    \ null,\n        username: null,\n        tokens: [],\n        models: [],\n \
    \       chatModel: '14b',\n        rawToken: null,\n    };\n\n    // DOM refs\n\
    \    const $ = (id) => document.getElementById(id);\n    const pages = ['login-page',\
    \ 'tokens-page', 'chat-page', 'api-guide-page', 'status-page'];\n    const navLinks\
    \ = ['nav-login', 'nav-tokens', 'nav-chat', 'nav-guide', 'nav-status'];\n\n  \
    \  // --- Utility ---\n    async function apiReq(path, opts = {}) {\n        const\
    \ url = API + path;\n        const headers = { 'Content-Type': 'application/json',\
    \ ...opts.headers };\n        const res = await fetch(url, { ...opts, headers,\
    \ credentials: 'include' });\n        let data;\n        try { data = await res.json();\
    \ } catch { data = null; }\n        return { status: res.status, ok: res.ok, data\
    \ };\n    }\n\n    function showPage(id) {\n        pages.forEach(p => document.getElementById(p).classList.remove('active'));\n\
    \        navLinks.forEach(l => document.getElementById(l).classList.remove('active'));\n\
    \        document.getElementById(id).classList.add('active');\n        const linkMap\
    \ = {\n            'login-page': 'nav-login', 'tokens-page': 'nav-tokens',\n \
    \           'chat-page': 'nav-chat', 'api-guide-page': 'nav-guide',\n        \
    \    'status-page': 'nav-status'\n        };\n        const link = document.getElementById(linkMap[id]);\n\
    \        if (link) link.classList.add('active');\n    }\n\n    function showAlert(id,\
    \ msg, type) {\n        const el = document.getElementById(id);\n        if (!el)\
    \ return;\n        el.textContent = msg;\n        el.className = 'alert alert-'\
    \ + type;\n        el.style.display = 'block';\n    }\n\n    function clearAlert(id)\
    \ {\n        const el = document.getElementById(id);\n        if (el) el.style.display\
    \ = 'none';\n    }\n\n    function formatDate(ts) {\n        if (!ts || ts ===\
    \ '0' || ts === 0) return '—';\n        return new Date(parseInt(ts) * 1000).toLocaleString();\n\
    \    }\n\n    // --- Auth ---\n    async function checkSession() {\n        const\
    \ r = await apiReq('/auth/me');\n        if (r.ok && r.data && r.data.username)\
    \ {\n            state.sessionId = 'active';\n            state.username = r.data.username;\n\
    \            return true;\n        }\n        return false;\n    }\n\n    async\
    \ function doLogin() {\n        clearAlert('login-alert');\n        const username\
    \ = $('login-user').value.trim();\n        const password = $('login-pass').value.trim();\n\
    \        if (!username || !password) {\n            showAlert('login-alert', 'Please\
    \ enter username and password.', 'warning');\n            return;\n        }\n\
    \        const r = await apiReq('/auth/login', {\n            method: 'POST',\n\
    \            body: JSON.stringify({ username, password })\n        });\n     \
    \   if (r.ok && r.data && r.data.session_id) {\n            state.sessionId =\
    \ r.data.session_id;\n            state.username = username;\n            $('login-user').value\
    \ = '';\n            $('login-pass').value = '';\n            await onAuth();\n\
    \        } else {\n            showAlert('login-alert', r.data && r.data.detail\
    \ ? r.data.detail : 'Login failed: HTTP ' + r.status, 'error');\n        }\n \
    \   }\n\n    async function doLogout() {\n        await apiReq('/auth/logout',\
    \ { method: 'POST' });\n        state.sessionId = null;\n        state.username\
    \ = null;\n        state.rawToken = null;\n        onUnauth();\n    }\n\n    //\
    \ --- Navigation after auth ---\n    async function onAuth() {\n        $('nav-username').textContent\
    \ = state.username;\n        document.querySelectorAll('.auth-only').forEach(el\
    \ => el.style.display = '');\n        document.querySelectorAll('.no-auth').forEach(el\
    \ => el.style.display = 'none');\n        $('login-alert').style.display = 'none';\n\
    \        await loadTokens();\n        await loadModels();\n        showPage('tokens-page');\n\
    \    }\n\n    function onUnauth() {\n        state.tokens = [];\n        state.models\
    \ = [];\n        $('nav-username').textContent = '';\n        document.querySelectorAll('.auth-only').forEach(el\
    \ => el.style.display = 'none');\n        document.querySelectorAll('.no-auth').forEach(el\
    \ => el.style.display = '');\n        showPage('login-page');\n    }\n\n    //\
    \ --- Tokens ---\n    async function loadTokens() {\n        const r = await apiReq('/tokens');\n\
    \        if (r.ok) {\n            const list = Array.isArray(r.data) ? r.data\
    \ : (Array.isArray(r.data.tokens) ? r.data.tokens : []);\n            state.tokens\
    \ = list;\n            renderTokens();\n        }\n    }\n\n    function renderTokens()\
    \ {\n        const tbody = $('token-list-body');\n        if (!tbody) return;\n\
    \        if (state.tokens.length === 0) {\n            tbody.innerHTML = '<tr><td\
    \ colspan=\"5\" style=\"color:var(--text-muted);text-align:center;padding:24px;\"\
    >No tokens yet. Create one above.</td></tr>';\n            return;\n        }\n\
    \        tbody.innerHTML = state.tokens.map(t => `\n            <tr>\n       \
    \         <td><code>${t.token_id || '—'}</code></td>\n                <td>${t.name\
    \ || '—'}</td>\n                <td>${Array.isArray(t.scopes) ? t.scopes.join(',\
    \ ') : (t.scopes || '—')}</td>\n                <td>${t.revoked === true || t.revoked\
    \ === 'true' || t.revoked === 1 || t.revoked === '1'\n                    ? '<span\
    \ style=\"color:var(--danger)\">Revoked</span>'\n                    : '<span\
    \ style=\"color:var(--success)\">Active</span>'}</td>\n                <td>\n\
    \                    ${(t.revoked === true || t.revoked === 'true' || t.revoked\
    \ === 1 || t.revoked === '1')\n                        ? '<span style=\"color:var(--text-muted);font-size:0.8rem;\"\
    >Revoked</span>'\n                        : `<button class=\"btn btn-danger btn-sm\"\
    \ onclick=\"App.revokeToken('${t.token_id}')\">Revoke</button>`}\n           \
    \     </td>\n            </tr>\n        `).join('');\n    }\n\n    async function\
    \ createToken() {\n        clearAlert('token-alert');\n        const name = $('token-name').value.trim();\n\
    \        const scopesInput = $('token-scopes').value.trim();\n        if (!name)\
    \ { showAlert('token-alert', 'Token name is required.', 'warning'); return; }\n\
    \        let scopes = ['model:14b:chat'];\n        if (scopesInput) {\n      \
    \      scopes = scopesInput.split(',').map(s => s.trim()).filter(Boolean);\n \
    \       }\n        const r = await apiReq('/tokens', {\n            method: 'POST',\n\
    \            body: JSON.stringify({ name, scopes })\n        });\n        if (r.ok\
    \ && r.data && r.data.token) {\n            state.rawToken = r.data.token;\n \
    \           $('raw-token-display').style.display = 'flex';\n            $('raw-token-value').textContent\
    \ = state.rawToken;\n            $('token-name').value = '';\n            $('token-scopes').value\
    \ = '';\n            showAlert('token-alert', 'Token created! Copy it now — it\
    \ will not be shown again.', 'success');\n            await loadTokens();\n  \
    \      } else {\n            const err = r.data && r.data.detail ? r.data.detail\
    \ : 'Failed: HTTP ' + r.status;\n            showAlert('token-alert', err, 'error');\n\
    \        }\n    }\n\n    async function revokeToken(tokenId) {\n        if (!confirm('Revoke\
    \ token ' + tokenId + '? This cannot be undone.')) return;\n        const r =\
    \ await apiReq('/tokens/' + tokenId, { method: 'DELETE' });\n        if (r.ok)\
    \ {\n            state.rawToken = null;\n            $('raw-token-display').style.display\
    \ = 'none';\n            await loadTokens();\n        } else {\n            showAlert('token-alert',\
    \ 'Revoke failed: HTTP ' + r.status, 'error');\n        }\n    }\n\n    function\
    \ copyToken() {\n        const val = $('raw-token-value').textContent;\n     \
    \   if (val && val !== '—') {\n            navigator.clipboard.writeText(val).then(()\
    \ => {\n                const btn = document.querySelector('.copy-btn');\n   \
    \             btn.textContent = 'Copied!';\n                setTimeout(() => {\
    \ btn.textContent = 'Copy'; }, 2000);\n            });\n        }\n    }\n\n \
    \   function dismissToken() {\n        state.rawToken = null;\n        $('raw-token-display').style.display\
    \ = 'none';\n    }\n\n    // --- Models ---\n    async function loadModels() {\n\
    \        const r = await apiReq('/models');\n        if (r.ok) {\n           \
    \ const list = Array.isArray(r.data) ? r.data : (Array.isArray(r.data.models)\
    \ ? r.data.models : []);\n            state.models = list;\n            renderModels();\n\
    \        }\n    }\n\n    function renderModels() {\n        const el = $('model-select');\n\
    \        if (!el) return;\n        el.innerHTML = state.models.map(m => {\n  \
    \          const id = m.id || m.model || '';\n            const label = id + (m.description\
    \ ? ' — ' + m.description : '');\n            return `<option value=\"${id}\"\
    >${label}</option>`;\n        }).join('');\n    }\n\n    // --- Chat ---\n   \
    \ async function sendChat() {\n        clearAlert('chat-alert');\n        const\
    \ text = $('chat-input').value.trim();\n        if (!text) return;\n        const\
    \ modelId = $('model-select').value || '14b';\n        appendChatMsg('user', text);\n\
    \        $('chat-input').value = '';\n\n        const r = await apiReq('/chat',\
    \ {\n            method: 'POST',\n            body: JSON.stringify({ model: modelId,\
    \ messages: [{ role: 'user', content: text }] })\n        });\n        if (r.ok\
    \ && r.data) {\n            const reply = r.data.choices && r.data.choices[0]\n\
    \                ? (r.data.choices[0].message || r.data.choices[0].text || '')\n\
    \                : (r.data.response || r.data.content || JSON.stringify(r.data));\n\
    \            const modelLabel = modelId.includes('32b') ? '32B (chat adapter)'\
    \ : modelId + ' chat';\n            appendChatMsg('assistant', reply, modelLabel);\n\
    \        } else {\n            const errDetail = r.data && r.data.detail ? r.data.detail\
    \ : 'HTTP ' + r.status;\n            appendChatMsg('assistant', 'Upstream error:\
    \ ' + errDetail, modelId, true);\n        }\n    }\n\n    function appendChatMsg(role,\
    \ text, label, isError) {\n        const box = $('chat-messages');\n        if\
    \ (!box) return;\n        const div = document.createElement('div');\n       \
    \ div.className = 'chat-msg';\n        const sender = document.createElement('div');\n\
    \        sender.className = 'sender' + (role === 'user' ? ' user' : '');\n   \
    \     sender.textContent = role === 'user' ? 'You' : (label || 'Assistant');\n\
    \        div.appendChild(sender);\n        const txt = document.createElement('div');\n\
    \        txt.className = 'text' + (isError ? ' error' : '');\n        txt.textContent\
    \ = text;\n        div.appendChild(txt);\n        box.appendChild(div);\n    \
    \    box.scrollTop = box.scrollHeight;\n    }\n\n    // --- Health / Status ---\n\
    \    async function loadStatus() {\n        try {\n            const res = await\
    \ fetch('/health');\n            const data = await res.json();\n            $('status-content').textContent\
    \ = JSON.stringify(data, null, 2);\n        } catch (e) {\n            $('status-content').textContent\
    \ = 'Error loading status: ' + e.message;\n        }\n    }\n\n    // --- Init\
    \ ---\n    async function init() {\n        // Expose functions to global scope\
    \ for inline onclick\n        window.App = {\n            doLogin, doLogout, createToken,\
    \ revokeToken, copyToken, dismissToken,\n            sendChat, loadStatus, showPage\n\
    \        };\n\n        // Check session\n        const hasSession = await checkSession();\n\
    \        if (hasSession) {\n            await onAuth();\n        } else {\n  \
    \          onUnauth();\n        }\n\n        // Load status on page show\n   \
    \     loadStatus();\n    }\n\n    document.addEventListener('DOMContentLoaded',\
    \ init);\n})();\n"
  index.html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    <title>Aither Portal</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n\
    </head>\n<body>\n\n<!-- Navbar -->\n<nav class=\"nav\">\n    <span class=\"logo\"\
    >Aither</span>\n    <a href=\"#\" id=\"nav-login\" class=\"no-auth active\" onclick=\"\
    App.showPage('login-page')\">Login</a>\n    <a href=\"#\" id=\"nav-tokens\" class=\"\
    auth-only\" style=\"display:none\" onclick=\"App.showPage('tokens-page')\">Tokens</a>\n\
    \    <a href=\"#\" id=\"nav-chat\" class=\"auth-only\" style=\"display:none\"\
    \ onclick=\"App.showPage('chat-page')\">Chat</a>\n    <a href=\"#\" id=\"nav-guide\"\
    \ onclick=\"App.showPage('api-guide-page')\">API Guide</a>\n    <a href=\"#\"\
    \ id=\"nav-status\" onclick=\"App.showPage('status-page')\">Status</a>\n    <span\
    \ class=\"spacer\"></span>\n    <span id=\"nav-username\" class=\"user-badge auth-only\"\
    \ style=\"display:none\"></span>\n    <button class=\"btn-logout auth-only\" style=\"\
    display:none\" onclick=\"App.doLogout()\">Logout</button>\n</nav>\n\n<div class=\"\
    container\">\n\n<!-- ==================== LOGIN PAGE ==================== -->\n\
    <div id=\"login-page\" class=\"page active\">\n    <h1>Login</h1>\n    <p>Sign\
    \ in to manage tokens and access AI models.</p>\n    <div class=\"card\" style=\"\
    max-width:400px\">\n        <div id=\"login-alert\" class=\"alert\" style=\"display:none\"\
    ></div>\n        <label for=\"login-user\">Username</label>\n        <input type=\"\
    text\" id=\"login-user\" placeholder=\"admin\" autocomplete=\"username\">\n  \
    \      <label for=\"login-pass\">Password</label>\n        <input type=\"password\"\
    \ id=\"login-pass\" placeholder=\"••••••••\" autocomplete=\"current-password\"\
    >\n        <button class=\"btn btn-primary\" onclick=\"App.doLogin()\" style=\"\
    width:100%\">Sign In</button>\n    </div>\n</div>\n\n<!-- ====================\
    \ TOKENS PAGE ==================== -->\n<div id=\"tokens-page\" class=\"page\"\
    >\n    <h1>API Tokens</h1>\n\n    <div id=\"token-alert\" class=\"alert\" style=\"\
    display:none\"></div>\n\n    <!-- Raw token display (shown once after creation)\
    \ -->\n    <div id=\"raw-token-display\" class=\"token-display\" style=\"display:none\"\
    >\n        <code id=\"raw-token-value\">—</code>\n        <button class=\"copy-btn\"\
    \ onclick=\"App.copyToken()\">Copy</button>\n        <button class=\"btn btn-secondary\
    \ btn-sm\" onclick=\"App.dismissToken()\" style=\"flex:0 0 auto\">Dismiss</button>\n\
    \    </div>\n\n    <!-- Create token -->\n    <div class=\"card\">\n        <h2>Create\
    \ Token</h2>\n        <div class=\"form-row\">\n            <div>\n          \
    \      <label for=\"token-name\">Name</label>\n                <input type=\"\
    text\" id=\"token-name\" placeholder=\"e.g. my-agent-token\">\n            </div>\n\
    \            <div>\n                <label for=\"token-scopes\">Scopes (comma-separated)</label>\n\
    \                <input type=\"text\" id=\"token-scopes\" placeholder=\"model:14b:chat,\
    \ model:32b:completion\">\n            </div>\n            <button class=\"btn\
    \ btn-primary\" onclick=\"App.createToken()\" style=\"flex:0 0 auto;align-self:flex-end;margin-bottom:12px\"\
    >Create</button>\n        </div>\n        <p class=\"desc\" style=\"margin:0;font-size:0.8rem;\"\
    >Available scopes: <code>model:14b:chat</code>, <code>model:32b:completion</code>,\
    \ <code>model:32b:chat-adapter</code>, <code>tokens:read</code>, <code>tokens:create</code>,\
    \ <code>tokens:revoke</code>. Raw token is shown only once.</p>\n    </div>\n\n\
    \    <!-- Token list -->\n    <div class=\"card\">\n        <h2>Your Tokens</h2>\n\
    \        <table>\n            <thead>\n                <tr><th>ID</th><th>Name</th><th>Scopes</th><th>Status</th><th>Action</th></tr>\n\
    \            </thead>\n            <tbody id=\"token-list-body\">\n          \
    \      <tr><td colspan=\"5\" style=\"color:var(--text-muted);text-align:center;padding:24px;\"\
    >Loading...</td></tr>\n            </tbody>\n        </table>\n    </div>\n</div>\n\
    \n<!-- ==================== CHAT PAGE ==================== -->\n<div id=\"chat-page\"\
    \ class=\"page\">\n    <h1>Chat with AI</h1>\n    <p>Send messages through Aither\
    \ BFF. <strong>14B</strong> uses native chat. <strong>32B</strong> uses chat adapter\
    \ over completion.</p>\n\n    <div class=\"card\">\n        <div class=\"form-row\"\
    \ style=\"align-items:center\">\n            <div style=\"flex:0 0 200px\">\n\
    \                <label for=\"model-select\">Model</label>\n                <select\
    \ id=\"model-select\">\n                    <option value=\"\">Loading models...</option>\n\
    \                </select>\n            </div>\n        </div>\n    </div>\n\n\
    \    <div id=\"chat-alert\" class=\"alert\" style=\"display:none\"></div>\n\n\
    \    <div class=\"card\">\n        <div id=\"chat-messages\" class=\"chat-box\"\
    >\n            <div class=\"chat-msg\">\n                <div class=\"sender\"\
    >System</div>\n                <div class=\"text\">Select a model and start chatting.\
    \ Upstream errors are shown honestly.</div>\n            </div>\n        </div>\n\
    \        <div class=\"chat-input-row\">\n            <input type=\"text\" id=\"\
    chat-input\" placeholder=\"Type your message...\" onkeydown=\"if(event.key==='Enter')App.sendChat()\"\
    >\n            <button class=\"btn btn-primary\" onclick=\"App.sendChat()\">Send</button>\n\
    \        </div>\n    </div>\n</div>\n\n<!-- ==================== API GUIDE PAGE\
    \ ==================== -->\n<div id=\"api-guide-page\" class=\"page\">\n    <h1>API\
    \ Access Guide</h1>\n    <p>Agents and external tools can access Aither models\
    \ through the BFF API using Bearer tokens.</p>\n\n    <div class=\"card\">\n \
    \       <h2>Authentication</h2>\n        <p>All API requests (except <code>/health</code>\
    \ and <code>/api/v1/auth/login</code>) require a valid API token.</p>\n      \
    \  <pre class=\"code-block\">Authorization: Bearer athr_&lt;your_token&gt;</pre>\n\
    \        <p>Create tokens in the <a href=\"#\" onclick=\"App.showPage('tokens-page')\"\
    >Tokens</a> page. The raw token is shown only once — copy it immediately.</p>\n\
    \    </div>\n\n    <div class=\"card\">\n        <h2>Endpoints</h2>\n\n      \
    \  <h3>List Models</h3>\n        <pre class=\"code-block\">GET /api/v1/models\n\
    Authorization: Bearer athr_&lt;token&gt;</pre>\n\n        <h3>Chat (14B native,\
    \ 32B adapter)</h3>\n        <pre class=\"code-block\">POST /api/v1/chat\nAuthorization:\
    \ Bearer athr_&lt;token&gt;\nContent-Type: application/json\n\n{\n  \"model\"\
    : \"14b\",\n  \"messages\": [{\"role\": \"user\", \"content\": \"Hello\"}]\n}</pre>\n\
    \n        <h3>Completions (32B only)</h3>\n        <pre class=\"code-block\">POST\
    \ /api/v1/completions\nAuthorization: Bearer athr_&lt;token&gt;\nContent-Type:\
    \ application/json\n\n{\n  \"model\": \"32b\",\n  \"prompt\": \"Once upon a time\"\
    \n}</pre>\n\n        <h3>Token Management</h3>\n        <pre class=\"code-block\"\
    >POST   /api/v1/tokens           # Create token\nGET    /api/v1/tokens       \
    \    # List tokens (metadata only)\nDELETE /api/v1/tokens/{id}      # Revoke token</pre>\n\
    \n        <div class=\"alert alert-warning\">\n            <strong>Note:</strong>\
    \ Raw API tokens are <strong>not stored</strong> on the server after creation.\n\
    \            The raw token is only returned once in the create response. Store\
    \ it securely.\n            If lost, revoke the token and create a new one.\n\
    \        </div>\n    </div>\n\n    <div class=\"card\">\n        <h2>Scope Requirements</h2>\n\
    \        <table>\n            <thead>\n                <tr><th>Endpoint</th><th>Required\
    \ Scope</th></tr>\n            </thead>\n            <tbody>\n               \
    \ <tr><td><code>GET /api/v1/models</code></td><td><code>model:*</code> or admin</td></tr>\n\
    \                <tr><td><code>POST /api/v1/chat</code> (14B)</td><td><code>model:14b:chat</code></td></tr>\n\
    \                <tr><td><code>POST /api/v1/chat</code> (32B adapter)</td><td><code>model:32b:chat-adapter</code></td></tr>\n\
    \                <tr><td><code>POST /api/v1/completions</code> (32B)</td><td><code>model:32b:completion</code></td></tr>\n\
    \                <tr><td><code>POST /api/v1/completions</code> (14B)</td><td>Not\
    \ supported (use chat instead)</td></tr>\n            </tbody>\n        </table>\n\
    \    </div>\n</div>\n\n<!-- ==================== STATUS PAGE ====================\
    \ -->\n<div id=\"status-page\" class=\"page\">\n    <h1>System Status</h1>\n \
    \   <p>BFF health endpoint proxied through Portal.</p>\n    <div class=\"card\"\
    >\n        <pre class=\"code-block\" id=\"status-content\">Loading...</pre>\n\
    \    </div>\n</div>\n\n</div><!-- /container -->\n\n<script src=\"app.js\"></script>\n\
    </body>\n</html>\n"
  nginx.conf: "server {\n    listen       80;\n    server_name  localhost;\n    root\
    \   /usr/share/nginx/html;\n    index  index.html;\n\n    # Reverse proxy to BFF\
    \ API\n    location /api/ {\n        proxy_pass http://aither-bff:8000/api/;\n\
    \        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n\
    \        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n      \
    \  proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_pass_header Set-Cookie;\n\
    \    }\n\n    # Proxy health endpoint\n    location /health {\n        proxy_pass\
    \ http://aither-bff:8000/health;\n        proxy_set_header Host $host;\n    }\n\
    \n    # Static files\n    location / {\n        try_files $uri $uri/ /index.html;\n\
    \    }\n}\n"
  styles.css: "/* Aither Portal — MVP Styles */\n:root {\n    --bg: #0d1117;\n   \
    \ --bg-card: #161b22;\n    --bg-input: #21262d;\n    --border: #30363d;\n    --text:\
    \ #c9d1d9;\n    --text-muted: #8b949e;\n    --accent: #58a6ff;\n    --accent-hover:\
    \ #79c0ff;\n    --danger: #f85149;\n    --success: #3fb950;\n    --warning: #d29922;\n\
    \    --radius: 6px;\n    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI',\
    \ Roboto, sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0;\
    \ }\nbody {\n    font-family: var(--font);\n    background: var(--bg);\n    color:\
    \ var(--text);\n    line-height: 1.6;\n    min-height: 100vh;\n}\na { color: var(--accent);\
    \ text-decoration: none; }\na:hover { color: var(--accent-hover); }\n\n.nav {\n\
    \    background: var(--bg-card);\n    border-bottom: 1px solid var(--border);\n\
    \    padding: 0 24px;\n    display: flex;\n    align-items: center;\n    height:\
    \ 56px;\n    gap: 24px;\n}\n.nav .logo { font-weight: 700; font-size: 1.1rem;\
