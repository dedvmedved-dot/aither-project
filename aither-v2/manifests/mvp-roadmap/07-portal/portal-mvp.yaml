kind: ConfigMap
metadata:
  name: aither-portal-config
  namespace: aither-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aither-portal
    stage: '07.2'
  name: aither-portal
  namespace: aither-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aither-portal
  template:
    metadata:
      labels:
        app: aither-portal
        stage: '07.2'
    spec:
      containers:
      - image: nginx:alpine
        name: nginx
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: config
          readOnly: true
        - mountPath: /usr/share/nginx/html
          name: www
          readOnly: true
      volumes:
      - configMap:
          items:
          - key: nginx.conf
            path: default.conf
          name: aither-portal-config
        name: config
      - configMap:
          items:
          - key: index.html
            path: index.html
          - key: styles.css
            path: styles.css
          - key: app.js
            path: app.js
          name: aither-portal-config
        name: www
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: aither-portal
    stage: '07.2'
  name: aither-portal
  namespace: aither-inference
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
  selector:
    app: aither-portal
