apiVersion: v1
kind: ConfigMap
metadata:
  name: aither-bff-config
  namespace: aither-inference
data:
  default.conf: |
    server {
        listen 8000;
        location /health { default_type application/json; return 200 '{"status":"ok"}'; }
        location /api/v1/chat { proxy_pass http://vllm-14b-instruct.aither-inference.svc:8000/v1/chat/completions; proxy_set_header Authorization $http_authorization; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300s; }
        location /api/v1/completions { proxy_pass http://nginx-gateway-32b.aither-inference.svc:8000/v1/completions; proxy_set_header Authorization $http_authorization; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300s; }
        location /api/v1/models { default_type application/json; return 200 '{"models":[{"id":"14b","type":"chat"},{"id":"32b","type":"completion"}]}'; }
        location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aither-bff
  namespace: aither-inference
  labels: { app: aither-bff }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aither-bff }
  template:
    metadata:
      labels: { app: aither-bff }
    spec:
      containers:
        - name: bff
          image: nginx:alpine
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN","SETGID","SETUID"] }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: aither-bff-config
---
apiVersion: v1
kind: Service
metadata:
  name: aither-bff
  namespace: aither-inference
  labels: { app: aither-bff }
spec:
  selector: { app: aither-bff }
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
