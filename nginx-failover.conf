# Gateway REST API — проброс на n8:8080 (python3 процесс)
server {
    listen 30900;
    server_name _;

    location / {
        proxy_pass http://10.129.13.78:30901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
