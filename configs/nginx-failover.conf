# VPS1 — Aither Portal reverse proxy с failover на VPS3
upstream portal_backend {
    server 130.17.1.90:80 max_fails=3 fail_timeout=30s;
    # server 89.127.217.88:80 max_fails=1 fail_timeout=10s backup;  # VPS3
}

server {
    listen 443 ssl http2;
    server_name aither.170.168.91.95.nip.io;

    ssl_certificate     /etc/nginx/ssl/aither.crt;
    ssl_certificate_key /etc/nginx/ssl/aither.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    if ($request_method = OPTIONS) { return 204; }

    location /health {
        proxy_pass http://portal_backend/api/v1/status;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
    }

    location /api/ {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /auth/ {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

server {
    listen 80;
    server_name aither.170.168.91.95.nip.io;
    return 301 https://$host$request_uri;
}
