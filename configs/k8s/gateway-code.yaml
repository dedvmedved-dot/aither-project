      \\\"aither-pki\\\")\\nVAULT_PKI_ROLE = os.environ.get(\\\"VAULT_PKI_ROLE\\\",
      \\\"api-key\\\")\\nVAULT_REQUEST_TIMEOUT = int(os.environ.get(\\\"VAULT_TIMEOUT\\\",
      \\\"5\\\"))\\n\\n# Redis for caching (imported at use site to avoid circular
      imports)\\n_redis_client = None\\n\\n\\ndef _get_redis(redis_module=None):\\n
      \   \\\"\\\"\\\"Lazy Redis client for cache.\\\"\\\"\\\"\\n    global _redis_client\\n
      \   if _redis_client is None and redis_module:\\n        try:\\n            redis_url
      = os.environ.get(\\\"REDIS_URL\\\", \\\"redis\\\")\\n            _redis_client
      = redis_module.Redis(\\n                host=redis_url, port=6379, decode_responses=True,\\n
      \               socket_connect_timeout=2)\\n        except Exception:\\n            pass\\n
      \   return _redis_client\\n\\n\\ndef _vault_api(method: str, path: str, body:
      dict = None) -\\u003e tuple:\\n    \\\"\\\"\\\"\\n    Call Vault HTTP API.\\n
      \   Returns (ok: bool, data: dict, error: str).\\n    \\\"\\\"\\\"\\n    if
      not VAULT_ENABLED:\\n        return False, {}, \\\"vault_disabled\\\"\\n\\n
      \   url = f\\\"{VAULT_ADDR}/v1/{path}\\\"\\n    headers = {\\n        \\\"X-Vault-Token\\\":
      VAULT_TOKEN,\\n        \\\"Content-Type\\\": \\\"application/json\\\",\\n    }\\n
      \   data = json.dumps(body).encode() if body else None\\n\\n    try:\\n        req
      = urllib.request.Request(url, data=data, headers=headers, method=method)\\n
      \       with urllib.request.urlopen(req, timeout=VAULT_REQUEST_TIMEOUT) as resp:\\n
      \           result = json.loads(resp.read())\\n            return True, result.get(\\\"data\\\",
      result), \\\"\\\"\\n    except urllib.error.HTTPError as e:\\n        try:\\n
      \           error_body = json.loads(e.read())\\n            errors = error_body.get(\\\"errors\\\",
      [str(e)])\\n            return False, error_body, \\\"; \\\".join(errors)\\n
      \       except Exception:\\n            return False, {}, f\\\"HTTP {e.code}\\\"\\n
      \   except Exception as e:\\n        return False, {}, f\\\"vault_unreachable:
      {e}\\\"\\n\\n\\n# ── Key Generation (called by BFF) ─────────────────────────────────────\\n\\ndef
      vault_create_api_key(org_id: str, key_name: str = \\\"default\\\",\\n                         ttl:
      str = \\\"2160h\\\", max_rpm: int = 60,\\n                         max_tpm:
      int = 100000, allowed_models: list = None,\\n                         ip_whitelist:
      list = None) -\\u003e dict:\\n    \\\"\\\"\\\"\\n    Issue a new API key via
      Vault PKI secrets engine.\\n\\n    Returns: { ok, api_key, fingerprint, expires_at,
      policies, error }\\n    \\\"\\\"\\\"\\n    if not VAULT_ENABLED:\\n        return
      {\\\"ok\\\": False, \\\"error\\\": \\\"vault_disabled\\\"}\\n\\n    # Build
      Vault PKI issue request with custom metadata\\n    payload = {\\n        \\\"common_name\\\":
      org_id,\\n        \\\"ttl\\\": ttl,\\n        \\\"metadata\\\": json.dumps({\\n
      \           \\\"org_id\\\": org_id,\\n            \\\"key_name\\\": key_name,\\n
      \           \\\"max_rpm\\\": str(max_rpm),\\n            \\\"max_tpm\\\": str(max_tpm),\\n
      \           \\\"allowed_models\\\": \\\",\\\".join(allowed_models) if allowed_models
      else \\\"\\\",\\n            \\\"ip_whitelist\\\": \\\",\\\".join(ip_whitelist)
      if ip_whitelist else \\\"\\\",\\n        }),\\n    }\\n\\n    ok, data, err
      = _vault_api(\\n        \\\"POST\\\",\\n        f\\\"{VAULT_PKI_PATH}/issue/{VAULT_PKI_ROLE}\\\",\\n
      \       payload,\\n    )\\n\\n    if not ok:\\n        return {\\\"ok\\\": False,
      \\\"error\\\": err}\\n\\n    # Vault PKI returns certificate + private_key\\n
      \   # We use the certificate serial as the API key\\n    # Format: ak-\\u003cbase64url(serial_number)\\u003e\\n
      \   import base64\\n    import hashlib\\n\\n    serial = data.get(\\\"serial_number\\\",
      \\\"\\\")\\n    # Create deterministic API key from serial\\n    api_key = \\\"ak-\\\"
      + base64.urlsafe_b64encode(\\n        hashlib.sha256(serial.encode()).digest()\\n
      \   )[:32].decode().rstrip(\\\"=\\\")\\n\\n    expires_at = data.get(\\\"expiration\\\",
      \\\"\\\")\\n    fingerprint = data.get(\\\"certificate\\\", \\\"\\\")[:64]  #
      First 64 chars as fingerprint\\n\\n    # Parse metadata back for policies\\n
      \   try:\\n        meta = json.loads(payload[\\\"metadata\\\"])\\n    except
      Exception:\\n        meta = {}\\n\\n    return {\\n        \\\"ok\\\": True,\\n
      \       \\\"api_key\\\": api_key,\\n        \\\"api_key_prefix\\\": api_key[:11],\\n
      \       \\\"fingerprint\\\": fingerprint[:16],\\n        \\\"expires_at\\\":
      expires_at,\\n        \\\"policies\\\": {\\n            \\\"max_rpm\\\": int(meta.get(\\\"max_rpm\\\",
      60)),\\n            \\\"max_tpm\\\": int(meta.get(\\\"max_tpm\\\", 100000)),\\n
      \           \\\"allowed_models\\\": meta.get(\\\"allowed_models\\\", \\\"\\\").split(\\\",\\\")
      if meta.get(\\\"allowed_models\\\") else [],\\n            \\\"ip_whitelist\\\":
      meta.get(\\\"ip_whitelist\\\", \\\"\\\").split(\\\",\\\") if meta.get(\\\"ip_whitelist\\\")
      else [],\\n            \\\"org_id\\\": org_id,\\n            \\\"key_name\\\":
      key_name,\\n        },\\n    }\\n\\n\\n# ── Key Validation (called by Gateway
      on every request) ─────────────────\\n\\ndef vault_validate_key(api_key: str,
      redis_module=None) -\\u003e dict:\\n    \\\"\\\"\\\"\\n    Validate API key
      against Vault with Redis caching.\\n\\n    Returns: { valid, org_id, policies,
      error, cached }\\n    \\\"\\\"\\\"\\n    if not VAULT_ENABLED:\\n        return
      {\\\"valid\\\": False, \\\"error\\\": \\\"vault_disabled\\\", \\\"cached\\\":
      False}\\n\\n    # 1. Check Redis cache (60s TTL)\\n    r = _get_redis(redis_module)\\n
      \   if r:\\n        cached = r.get(f\\\"vault:key:{api_key[:32]}\\\")\\n        if
      cached:\\n            try:\\n                data = json.loads(cached)\\n                data[\\\"cached\\\"]
      = True\\n                return data\\n            except Exception:\\n                pass\\n\\n
      \   # 2. Validate via Vault API\\n    # Vault PKI doesn't have a direct \\\"validate\\\"
      endpoint,\\n    # so we use the cert serial lookup or a custom endpoint.\\n
      \   # For now: use Vault KV secrets engine as key store\\n    kv_path = f\\\"secret/data/aither/keys/{api_key[:32]}\\\"\\n
      \   ok, data, err = _vault_api(\\\"GET\\\", kv_path)\\n\\n    if not ok:\\n
      \       # Cache negative result briefly (10s)\\n        if r:\\n            r.setex(f\\\"vault:key:{api_key[:32]}\\\",
      10, json.dumps(\\n                {\\\"valid\\\": False, \\\"error\\\": err,
      \\\"cached\\\": False}))\\n        return {\\\"valid\\\": False, \\\"error\\\":
      err, \\\"cached\\\": False}\\n\\n    # 3. Extract policies\\n    key_data =
      data.get(\\\"data\\\", data)\\n    policies = key_data.get(\\\"policies\\\",
      {})\\n    if isinstance(policies, str):\\n        try:\\n            policies
      = json.loads(policies)\\n        except Exception:\\n            policies =
      {}\\n\\n    result = {\\n        \\\"valid\\\": True,\\n        \\\"org_id\\\":
      key_data.get(\\\"org_id\\\", \\\"unknown\\\"),\\n        \\\"user_id\\\": key_data.get(\\\"user_id\\\",
      \\\"\\\"),\\n        \\\"key_name\\\": key_data.get(\\\"key_name\\\", \\\"vault\\\"),\\n
      \       \\\"policies\\\": {\\n            \\\"max_rpm\\\": int(policies.get(\\\"max_rpm\\\",
      300)),\\n            \\\"max_tpm\\\": int(policies.get(\\\"max_tpm\\\", 100000)),\\n
      \           \\\"allowed_models\\\": policies.get(\\\"allowed_models\\\", []),\\n
      \           \\\"ip_whitelist\\\": policies.get(\\\"ip_whitelist\\\", []),\\n
      \       },\\n        \\\"expires_at\\\": key_data.get(\\\"expires_at\\\", \\\"\\\"),\\n
      \       \\\"cached\\\": False,\\n    }\\n\\n    # 4. Cache in Redis (60s)\\n
      \   if r:\\n        r.setex(f\\\"vault:key:{api_key[:32]}\\\", 60, json.dumps(result))\\n\\n
      \   return result\\n\\n\\ndef vault_revoke_key(api_key: str) -\\u003e dict:\\n
      \   \\\"\\\"\\\"Revoke API key in Vault.\\\"\\\"\\\"\\n    if not VAULT_ENABLED:\\n
      \       return {\\\"ok\\\": False, \\\"error\\\": \\\"vault_disabled\\\"}\\n\\n
      \   # Try KV delete first, then PKI revoke\\n    ok, data, err = _vault_api(\\\"DELETE\\\",
      f\\\"secret/data/aither/keys/{api_key[:32]}\\\")\\n    if not ok:\\n        return
      {\\\"ok\\\": False, \\\"error\\\": err}\\n\\n    # Clear Redis cache\\n    r
      = _get_redis()\\n    if r:\\n        r.delete(f\\\"vault:key:{api_key[:32]}\\\")\\n\\n
      \   return {\\\"ok\\\": True, \\\"revoked\\\": api_key[:16] + \\\"...\\\"}\\n\\n\\n#
      ── Health Check ───────────────────────────────────────────────────────\\n\\ndef
      vault_health() -\\u003e dict:\\n    \\\"\\\"\\\"Check Vault connectivity and
      seal status.\\\"\\\"\\\"\\n    if not VAULT_ENABLED:\\n        return {\\\"enabled\\\":
      False, \\\"status\\\": \\\"disabled\\\"}\\n\\n    ok, data, err = _vault_api(\\\"GET\\\",
      \\\"sys/health\\\")\\n    if not ok:\\n        return {\\\"enabled\\\": True,
      \\\"status\\\": \\\"unreachable\\\", \\\"error\\\": err}\\n\\n    return {\\n
      \       \\\"enabled\\\": True,\\n        \\\"status\\\": \\\"ok\\\" if data.get(\\\"initialized\\\")
      else \\\"not_initialized\\\",\\n        \\\"sealed\\\": data.get(\\\"sealed\\\",
      True),\\n        \\\"version\\\": data.get(\\\"version\\\", \\\"\\\"),\\n    }\\n\",\"wiki_graph.py\":\"\\\"\\\"\\\"\\nLLM-Wiki
      Graph Engine — Karpathy-style knowledge graph from interlinked markdown.\\n\\nParses
      wiki/*.md files, extracts YAML frontmatter + [[wikilinks]], builds an\\nin-memory
      graph for traversal during hybrid RAG queries.\\n\\nVocabulary:\\n  Node      =
      a wiki page (file path)\\n  Edge      = [[wikilink]] from one page to another\\n
      \ Neighbor  = page reachable via 1-hop\\n  Subgraph  = neighborhood of radius
      N around a query hit\\n\\\"\\\"\\\"\\nimport os\\nimport re\\nimport yaml\\nfrom
      pathlib import Path\\nfrom dataclasses import dataclass, field\\nfrom typing
      import Optional\\n\\n\\nWIKI_ROOT = os.environ.get(\\\"WIKI_ROOT\\\", \\\"/app/wiki\\\")\\nFRONTMATTER_RE
      = re.compile(r'^---\\\\s*\\\\n(.*?)\\\\n---\\\\s*\\\\n', re.DOTALL)\\nWIKILINK_RE
      = re.compile(r'\\\\[\\\\[([^\\\\]|#]+)(?:\\\\|[^\\\\]]+)?\\\\]\\\\]')\\n\\n\\n@dataclass\\nclass
      WikiPage:\\n    \\\"\\\"\\\"A single wiki page with metadata and outbound links.\\\"\\\"\\\"\\n
      \   path: str               # relative to WIKI_ROOT, e.g. 'concepts/vllm-inference.md'\\n
      \   title: str              # from frontmatter\\n    page_type: str          #
      entity | concept | comparison | query\\n    tags: list[str] = field(default_factory=list)\\n
      \   content: str = \\\"\\\"       # body without frontmatter\\n    outlinks:
      list[str] = field(default_factory=list)  # [[target]] paths (bare names)\\n
      \   summary: str = \\\"\\\"       # first meaningful paragraph (~200 chars)\\n\\n\\nclass
      WikiGraph:\\n    \\\"\\\"\\\"\\n    In-memory graph of all wiki pages.\\n\\n
      \   Usage:\\n        graph = WikiGraph(wiki_root=\\\"/app/wiki\\\")\\n        graph.load()\\n\\n
      \       # Get a page\\n        page = graph.get(\\\"vllm-inference\\\")\\n\\n
      \       # Get neighbors (1-hop)\\n        neighbors = graph.neighbors(\\\"vllm-inference\\\")\\n\\n
      \       # Traverse subgraph (radius N)\\n        pages = graph.subgraph([\\\"vllm-inference\\\"],
      radius=2)\\n\\n        # Full-text search\\n        pages = graph.search(\\\"GPU
      memory\\\")\\n    \\\"\\\"\\\"\\n\\n    def __init__(self, wiki_root: str =
      WIKI_ROOT):\\n        self.root = Path(wiki_root)\\n        self._pages: dict[str,
      WikiPage] = {}  # slug → WikiPage\\n        self._by_title: dict[str, str] =
      {}    # title → slug\\n        self._inlinks: dict[str, set[str]] = {}  # slug
      → inbound slugs\\n        self._loaded = False\\n\\n    # ── Loading ──────────────────────────────────────────────────────────\\n\\n
      \   def load(self) -\\u003e int:\\n        \\\"\\\"\\\"Scan wiki/ directory
      and load all pages. Returns count.\\\"\\\"\\\"\\n        self._pages.clear()\\n
      \       self._by_title.clear()\\n        self._inlinks.clear()\\n\\n        count
      = 0\\n\\n        # Mode 1: hierarchical (entities/, concepts/, etc.)\\n        scan_dirs
      = ['entities', 'concepts', 'comparisons', 'queries']\\n        found_hierarchical
      = False\\n        for subdir in scan_dirs:\\n            d = self.root / subdir\\n
      \           if d.is_dir():\\n                found_hierarchical = True\\n                for
      md_file in sorted(d.glob('*.md')):\\n                    page = self._parse_file(md_file)\\n
      \                   if page:\\n                        self._index(page)\\n
      \                       count += 1\\n\\n        if found_hierarchical:\\n            self._loaded
      = True\\n            return count\\n\\n        # Mode 2: flat ConfigMap layout
      (entities-filename.md, concepts-filename.md)\\n        for md_file in sorted(self.root.glob('*.md')):\\n
      \           name = md_file.name\\n            if name in ('SCHEMA.md', 'index.md',
      'log.md'):\\n                continue\\n            # Parse prefix: entities-xxx.md
      → entities/xxx.md\\n            for prefix in scan_dirs:\\n                if
      name.startswith(f'{prefix}-'):\\n                    page = self._parse_file(md_file,
      virtual_dir=prefix)\\n                    if page:\\n                        self._index(page)\\n
      \                       count += 1\\n                    break\\n\\n        self._loaded
      = True\\n        return count\\n\\n    def _parse_file(self, filepath: Path,
      virtual_dir: str = None) -\\u003e Optional[WikiPage]:\\n        \\\"\\\"\\\"Parse
      a single .md file into a WikiPage.\\\"\\\"\\\"\\n        try:\\n            raw
      = filepath.read_text(encoding='utf-8')\\n        except Exception:\\n            return
      None\\n\\n        if virtual_dir:\\n            # Flat layout: entities-xxx.md
      → entities/xxx.md\\n            rel = f\\\"{virtual_dir}/{filepath.name}\\\"\\n
      \       else:\\n            rel = str(filepath.relative_to(self.root))\\n\\n
      \       # Extract frontmatter\\n        fm = {}\\n        body = raw\\n        m
      = FRONTMATTER_RE.match(raw)\\n        if m:\\n            try:\\n                fm
      = yaml.safe_load(m.group(1)) or {}\\n            except yaml.YAMLError:\\n                pass\\n
      \           body = raw[m.end():]\\n\\n        title = fm.get('title', filepath.stem.replace('-',
      ' ').title())\\n        page_type = fm.get('type', 'concept')\\n        tags
      = fm.get('tags', [])\\n        if isinstance(tags, str):\\n            tags
      = [t.strip() for t in tags.split(',')]\\n\\n        # Extract [[wikilinks]]
      from body\\n        outlinks_raw = WIKILINK_RE.findall(body)\\n        outlinks
      = list(dict.fromkeys(outlinks_raw))  # deduplicate, keep order\\n\\n        #
      Summary: first paragraph of substance (skip blank lines, headers)\\n        summary
      = self._extract_summary(body)\\n\\n        return WikiPage(\\n            path=rel,\\n
      \           title=title,\\n            page_type=page_type,\\n            tags=tags,\\n
      \           content=body.strip(),\\n            outlinks=outlinks,\\n            summary=summary,\\n
      \       )\\n\\n    @staticmethod\\n    def _extract_summary(body: str, max_chars:
      int = 300) -\\u003e str:\\n        \\\"\\\"\\\"Extract first meaningful paragraph
      as summary.\\\"\\\"\\\"\\n        lines = body.strip().split('\\\\n')\\n        para
      = []\\n        for line in lines:\\n            stripped = line.strip()\\n            if
      not stripped or stripped.startswith('#'):\\n                if para:\\n                    break\\n
      \               continue\\n            para.append(stripped)\\n            joined
      = ' '.join(para)\\n            if len(joined) \\u003e max_chars:\\n                break\\n
      \       result = ' '.join(para)\\n        if len(result) \\u003e max_chars:\\n
      \           result = result[:max_chars].rsplit(' ', 1)[0] + '…'\\n        return
      result\\n\\n    def _index(self, page: WikiPage):\\n        \\\"\\\"\\\"Insert
      page into in-memory indices.\\\"\\\"\\\"\\n        slug = self._slug(page.path)\\n
      \       self._pages[slug] = page\\n        self._by_title[page.title.lower()]
      = slug\\n\\n        # Build inlinks: for each outlink, record that 'slug' links
      to it\\n        for target_raw in page.outlinks:\\n            target = self._normalize_slug(target_raw)\\n
      \           if target not in self._inlinks:\\n                self._inlinks[target]
      = set()\\n            self._inlinks[target].add(slug)\\n\\n    # ── Slug resolution
      ──────────────────────────────────────────────────\\n\\n    @staticmethod\\n
      \   def _slug(path: str) -\\u003e str:\\n        \\\"\\\"\\\"Convert 'concepts/vllm-inference.md'
      → 'vllm-inference'.\\\"\\\"\\\"\\n        return Path(path).stem.lower()\\n\\n
      \   @staticmethod\\n    def _normalize_slug(raw: str) -\\u003e str:\\n        \\\"\\\"\\\"Normalize
      [[Target Name]] → 'target-name'.\\\"\\\"\\\"\\n        return raw.strip().lower().replace('
      ', '-').replace('_', '-')\\n\\n    def _resolve(self, slug_or_title: str) -\\u003e
      Optional[str]:\\n        \\\"\\\"\\\"Resolve a slug or title to a canonical
      slug. Returns None if not found.\\\"\\\"\\\"\\n        key = slug_or_title.lower().replace('
      ', '-').replace('_', '-')\\n        if key in self._pages:\\n            return
      key\\n        # Try by title\\n        return self._by_title.get(slug_or_title.lower())\\n\\n
      \   # ── Public API ───────────────────────────────────────────────────────\\n\\n
      \   @property\\n    def loaded(self) -\\u003e bool:\\n        return self._loaded\\n\\n
      \   @property\\n    def page_count(self) -\\u003e int:\\n        return len(self._pages)\\n\\n
      \   def get(self, slug_or_title: str) -\\u003e Optional[WikiPage]:\\n        \\\"\\\"\\\"Get
      a single page by slug or title.\\\"\\\"\\\"\\n        key = self._resolve(slug_or_title)\\n
      \       return self._pages.get(key) if key else None\\n\\n    def list_all(self)
      -\\u003e list[WikiPage]:\\n        return list(self._pages.values())\\n\\n    def
      neighbors(self, slug_or_title: str) -\\u003e list[WikiPage]:\\n        \\\"\\\"\\\"1-hop
      neighbors (both outbound and inbound).\\\"\\\"\\\"\\n        page = self.get(slug_or_title)\\n
      \       if not page:\\n            return []\\n\\n        seen = set()\\n        result
      = []\\n\\n        # Outbound: pages THIS page links to\\n        for target_raw
      in page.outlinks:\\n            target = self._resolve(target_raw)\\n            if
      target and target not in seen:\\n                seen.add(target)\\n                result.append(self._pages[target])\\n\\n
      \       # Inbound: pages that link TO this page\\n        slug = self._slug(page.path)\\n
      \       for source in self._inlinks.get(slug, set()):\\n            if source
      not in seen and source in self._pages:\\n                seen.add(source)\\n
      \               result.append(self._pages[source])\\n\\n        return result\\n\\n
      \   def subgraph(self, slugs: list[str], radius: int = 1) -\\u003e list[WikiPage]:\\n
      \       \\\"\\\"\\\"\\n        BFS traversal from seed slugs, expanding up to
      `radius` hops.\\n        Returns all pages in the neighborhood (including seeds).\\n
      \       Radius=1 = seeds + direct neighbors. Radius=2 = + neighbors of neighbors.\\n
      \       \\\"\\\"\\\"\\n        visited: set[str] = set()\\n        frontier:
      set[str] = set()\\n\\n        for s in slugs:\\n            key = self._resolve(s)\\n
      \           if key:\\n                frontier.add(key)\\n\\n        for _ in
      range(radius + 1):\\n            if not frontier:\\n                break\\n
      \           next_frontier: set[str] = set()\\n            for slug in frontier:\\n
      \               if slug in visited:\\n                    continue\\n                visited.add(slug)\\n
      \               page = self._pages.get(slug)\\n                if not page:\\n
      \                   continue\\n                # Add outbound\\n                for
      target_raw in page.outlinks:\\n                    t = self._resolve(target_raw)\\n
      \                   if t and t not in visited:\\n                        next_frontier.add(t)\\n
      \               # Add inbound\\n                for source in self._inlinks.get(slug,
      set()):\\n                    if source not in visited and source in self._pages:\\n
      \                       next_frontier.add(source)\\n            frontier = next_frontier\\n\\n
      \       return [self._pages[s] for s in visited if s in self._pages]\\n\\n    def
      search(self, query: str, limit: int = 10) -\\u003e list[WikiPage]:\\n        \\\"\\\"\\\"\\n
      \       Simple full-text search across titles, tags, summaries, and content.\\n
      \       For semantic search, use ChromaDB; this is for exact/keyword matching.\\n
      \       \\\"\\\"\\\"\\n        terms = query.lower().split()\\n        scored:
      list[tuple[float, WikiPage]] = []\\n\\n        for page in self._pages.values():\\n
      \           score = 0.0\\n            searchable = (\\n                page.title.lower()
      + ' ' +\\n                ' '.join(page.tags).lower() + ' ' +\\n                page.summary.lower()
      + ' ' +\\n                page.content.lower()\\n            )\\n            for
      term in terms:\\n                count = searchable.count(term)\\n                if
      count \\u003e 0:\\n                    score += count\\n                # Bonus
      for title match\\n                if term in page.title.lower():\\n                    score
      += 5.0\\n            if score \\u003e 0:\\n                scored.append((score,
      page))\\n\\n        scored.sort(key=lambda x: x[0], reverse=True)\\n        return
      [p for _, p in scored[:limit]]\\n\\n\\n# ── Singleton ────────────────────────────────────────────────────────────\\n\\n_wiki_graph:
      Optional[WikiGraph] = None\\n\\n\\ndef get_wiki_graph(wiki_root: str = WIKI_ROOT)
      -\\u003e WikiGraph:\\n    \\\"\\\"\\\"Get or initialize the global WikiGraph
      singleton.\\\"\\\"\\\"\\n    global _wiki_graph\\n    if _wiki_graph is None:\\n
      \       _wiki_graph = WikiGraph(wiki_root)\\n        _wiki_graph.load()\\n    return
      _wiki_graph\\n\\n\\ndef reload_wiki_graph(wiki_root: str = WIKI_ROOT) -\\u003e
      WikiGraph:\\n    \\\"\\\"\\\"Force reload of the wiki graph (after wiki ingest).\\\"\\\"\\\"\\n
      \   global _wiki_graph\\n    _wiki_graph = WikiGraph(wiki_root)\\n    _wiki_graph.load()\\n
      \   return _wiki_graph\\n\"},\"kind\":\"ConfigMap\",\"metadata\":{\"annotations\":{},\"creationTimestamp\":null,\"name\":\"gateway-code\",\"namespace\":\"default\"}}\n"
