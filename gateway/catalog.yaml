# Aither Model Catalog — актуальный для текущего кластера
# Gateway использует этот файл для роутинга запросов к vLLM-подам
#
# Field mapping for catalog.py:
#   name        → model identifier (used for routing + API)
#   backend     → upstream vLLM base URL
#   model_path  → served model name passed to vLLM
#   display_name, description, tags, max_tokens, tokens_per_ruble, tier_access, status, endpoint_type

models:
  - name: qwen-14b
    display_name: "Qwen 2.5 14B Instruct"
    description: "Быстрая универсальная модель — чаты, summarization, код"
    backend: "http://vllm-14b-instruct.aither-inference.svc:8000"
    model_path: "qwen-14b"
    endpoint_type: chat_completions
    status: active
    max_tokens: 4096
    tokens_per_ruble: 100
    tier_access: [free, standard, vip, enterprise]
    rag_support: false
    stream_support: true
    timeout_seconds: 300
    health_endpoint: "/health"

  - name: qwen-32b-base
    display_name: "Qwen 2.5 32B GPTQ"
    description: "Мощная базовая модель — аналитика, длинные тексты, сложный код"
    backend: "http://vllm-32b-gptq.aither-inference.svc:8000"
    model_path: "qwen-32b-base"
    endpoint_type: completions
    status: active
    max_tokens: 4096
    tokens_per_ruble: 30
    tier_access: [standard, vip, enterprise]
    rag_support: false
    stream_support: true
    timeout_seconds: 300
    health_endpoint: "/health"
    note: "Базовая модель — требует chat-адаптер для диалогов"
